<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily unavailable</title>
<style>
:root{--bg:#F2F6F8;--surface:#FCFDFD;--ink:#0F2534;--muted:#566B7A;--line:#D9E3EA}
@media (prefers-color-scheme:dark){:root{--bg:#0A1620;--surface:#11212E;--ink:#E5EEF3;--muted:#8DA2B1;--line:#203545}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.box{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;text-align:center}
h1{font-size:1.25rem;margin:0 0 8px}
p{margin:0;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <h1>Temporarily unavailable</h1>
  <p>This page is closed for now.</p>
</div>
</body>
</html>
