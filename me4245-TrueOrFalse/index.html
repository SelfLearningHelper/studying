<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ME 4245 TrueOrFalse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF0; --surface:#F7F9FA; --ink:#1D2A31; --muted:#5E6E76; --line:#CFD8DC;
  --primary:#2F6F6A; --primary-soft:#D6E7E4; --ok:#2E8657; --ok-soft:#DCEFE3; --bad:#B6483F; --bad-soft:#F5DEDB;
  --idle:#C3CDD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A1E; --surface:#1B242A; --ink:#E3EAEC; --muted:#93A3AA; --line:#2E3A41;
    --primary:#6FB5AC; --primary-soft:#1F3634; --ok:#5DBB86; --ok-soft:#1C3527; --bad:#E07C73; --bad-soft:#3A2220;
    --idle:#34424A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#131A1E; --surface:#1B242A; --ink:#E3EAEC; --muted:#93A3AA; --line:#2E3A41;
  --primary:#6FB5AC; --primary-soft:#1F3634; --ok:#5DBB86; --ok-soft:#1C3527; --bad:#E07C73; --bad-soft:#3A2220;
  --idle:#34424A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  font-size:clamp(16px, 0.45vw + 14.5px, 19px); line-height:1.7;
}
.wrap{width:100%; max-width:760px; margin:0 auto; padding:clamp(20px,4vw,48px) clamp(14px,4vw,32px) 64px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--primary); outline-offset:2px}
.hidden{display:none !important}

/* setup */
.intro h1{font-size:clamp(1.7rem, 3vw + 1rem, 2.5rem); line-height:1.25; margin:10px 0 6px; font-weight:700; letter-spacing:-.3px}
.intro p{margin:0; color:var(--muted); max-width:60ch}
.group{margin-top:30px}
.group h2{font-size:1rem; font-weight:600; margin:0 0 12px}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mode{
  text-align:start; background:var(--surface); border:2px solid var(--line); border-radius:14px;
  padding:16px 16px 14px; transition:border-color .15s, background .15s;
}
.mode{display:flex; flex-direction:column; justify-content:flex-start}
.mode strong{display:block; font-size:1.02rem; margin-bottom:4px}
.mode span{color:var(--muted); font-size:.9rem; line-height:1.55; display:block}
.mode[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft)}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  min-width:64px; min-height:46px; padding:8px 16px; border-radius:999px; border:2px solid var(--line);
  background:var(--surface); font-weight:600; font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{border-color:var(--primary); background:var(--primary); color:var(--surface)}
.chip.en{font-family:'Segoe UI', system-ui, sans-serif}
.note{color:var(--muted); font-size:.88rem; margin-top:10px}
.start{
  margin-top:34px; width:100%; min-height:54px; padding:14px; border:none; border-radius:14px;
  background:var(--primary); color:var(--surface); font-weight:700; font-size:1.08rem;
}
@media (hover:hover){ .start:hover{filter:brightness(1.07)} }
.start:disabled{opacity:.45; cursor:default}
.start.secondary{background:var(--surface); color:var(--ink); border:2px solid var(--line); margin-top:12px}

/* quiz */
.bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.pos{font-weight:600; font-variant-numeric:tabular-nums}
.pos small{color:var(--muted); font-weight:400}
.barside{display:flex; align-items:center; gap:8px}
.timer{font-variant-numeric:tabular-nums; font-weight:700; padding:4px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); direction:ltr}
.timer.low{color:var(--bad); border-color:var(--bad)}
.mini{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:.85rem; min-height:34px}
.quit{background:none; border:none; color:var(--muted); font-size:.9rem; text-decoration:underline; padding:6px}
.rail{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.dot{width:14px; height:14px; border-radius:50%; background:var(--idle); border:none; padding:0; transition:transform .15s, background .2s}
.dot.cur{outline:2px solid var(--ink); outline-offset:2px}
.dot.ans{background:var(--primary)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
@media (hover:hover){ .rail.jump .dot:hover{transform:scale(1.25)} }
@media (pointer:coarse){ .rail.jump .dot{width:18px; height:18px} }
.card{background:var(--surface); border-radius:18px; padding:clamp(18px,3vw,32px) clamp(15px,3vw,30px); border:1px solid var(--line)}
.lecTag{display:inline-block; background:var(--primary-soft); color:var(--primary); font-size:.78rem; font-weight:600; padding:3px 12px; border-radius:999px; margin-bottom:12px}
.qtext{font-size:1.18rem; font-weight:600; line-height:1.65; margin:0 0 18px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{
  display:flex; align-items:flex-start; gap:12px; text-align:start; width:100%; min-height:52px;
  background:var(--bg); border:2px solid transparent; border-radius:12px; padding:12px 14px;
  transition:border-color .12s, background .12s;
}
@media (hover:hover){ .opt:hover:not(:disabled){border-color:var(--line)} }
.opt .l{
  flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface); border:1.5px solid var(--line); font-weight:700; font-size:.9rem; margin-top:1px;
}
.opt .t{flex:1; min-width:0; overflow-wrap:anywhere}
.opt.sel{border-color:var(--primary); background:var(--primary-soft)}
.opt.sel .l{background:var(--primary); color:var(--surface); border-color:var(--primary)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.ok .l{background:var(--ok); color:var(--surface); border-color:var(--ok)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.bad .l{background:var(--bad); color:var(--surface); border-color:var(--bad)}
.opt:disabled{cursor:default; color:inherit}
.why{margin-top:16px; padding:14px 16px; border-radius:12px; border-inline-start:4px solid var(--ok); background:var(--ok-soft); font-size:.97rem}
.why.bad{border-inline-start-color:var(--bad); background:var(--bad-soft)}
.why b{display:block; margin-bottom:2px}
.nav{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; min-height:52px; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:600}
.btn.main{background:var(--primary); border-color:var(--primary); color:var(--surface)}
.btn:disabled{opacity:.45; cursor:default}
.hint{color:var(--muted); font-size:.85rem; margin-top:10px; text-align:center}

/* result */
.score{text-align:center; padding:26px 0 10px}
.score .big{font-size:clamp(3.4rem, 6vw + 1.5rem, 5rem); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; direction:ltr}
.score .big span{font-size:.42em; color:var(--muted); font-weight:500}
.score p{margin:10px 0 0; color:var(--muted)}
.verdict{font-size:1.15rem; font-weight:600; color:var(--ink) !important; margin-top:14px !important}
.tools{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px; gap:10px; flex-wrap:wrap}
.tools h2{margin:0; font-size:1.1rem}
.toggle{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.9rem; min-height:38px}
.toggle[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.review{display:grid; grid-template-columns:1fr; gap:10px}
.rev{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; border-inline-start:5px solid var(--ok)}
.rev.bad{border-inline-start-color:var(--bad)}
.rev .rq{font-weight:600; margin:0 0 8px}
.rev .ra{font-size:.93rem; margin:2px 0}
.rev .ra.wrong{color:var(--bad)}
.rev .ra.right{color:var(--ok)}
.rev .re{font-size:.9rem; color:var(--muted); margin-top:8px}
.again{margin-top:22px}

/* summary */
.sec{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px}
.sec h3{margin:0 0 10px; font-size:1.05rem; color:var(--primary)}
.sec ul, .sec ol{margin:0; padding-inline-start:22px; display:flex; flex-direction:column; gap:6px; font-size:.97rem; line-height:1.6}

/* true / false */
.opts.tf{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.opts.tf .opt{justify-content:center; align-items:center; min-height:64px; font-weight:700; font-size:1.05rem}
.opts.tf .opt .t{flex:none}
.countBox{display:flex; flex-direction:column; gap:12px; max-width:420px}
.countRow{display:flex; align-items:center; gap:10px}
.stepBtn{flex:none; width:48px; height:48px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-size:1.4rem; font-weight:700; line-height:1}
.countInput{flex:1; min-width:0; height:48px; border-radius:12px; border:2px solid var(--primary); background:var(--surface); color:var(--ink); text-align:center; font:inherit; font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums}
.countInput:focus-visible{outline:3px solid var(--primary); outline-offset:2px}
.countRange{width:100%; accent-color:var(--primary); margin:0; height:28px}
.rangeEnds{display:flex; justify-content:space-between; color:var(--muted); font-size:.82rem; font-variant-numeric:tabular-nums; margin-top:-8px}
#countQuick{flex-wrap:wrap}
#countQuick .chip{flex:1 1 auto; min-width:56px; min-height:44px; padding:6px 14px; white-space:nowrap; border-radius:999px}
.confirmBox{margin-top:18px; padding:14px 16px; border-radius:12px; background:var(--bad-soft); border:1px solid var(--bad)}
.confirmBox p{margin:0 0 4px; font-weight:600}
.confirmBox .nav{margin-top:10px}
#lectures, #sumTabs{display:grid; grid-template-columns:1fr; gap:8px}
#lectures .chip, #sumTabs .chip{width:100%; border-radius:12px; padding:10px 16px; text-align:start; flex:none}

/* phones */
@media (max-width:560px){
  .modes{grid-template-columns:1fr}
  .qtext{font-size:1.08rem}
  .chip{flex:1 1 0; min-width:0; padding:8px 0}
}
/* tablets landscape & laptops */
@media (min-width:1024px){
  .wrap{max-width:880px}
  .setup-grid{display:grid; grid-template-columns:1fr 1.15fr; gap:48px; align-items:start; min-height:70vh; align-content:center}
  .setup-grid .intro{position:sticky; top:48px}
  .setup-grid .group:first-child{margin-top:0}
  .review{grid-template-columns:1fr 1fr; align-items:start}
}
@media (min-width:1024px) and (min-height:700px){
  #quiz .card{min-height:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <section id="setup">
    <div class="setup-grid">
      <div class="intro">
        <h1 data-i="title"></h1>
        <p data-i="sub"></p>
      </div>
      <div>
        <div class="group">
          <h2 data-i="langH"></h2>
          <div class="chips" id="langs">
            <button class="chip" data-lang="ar" aria-pressed="true">العربية</button>
            <button class="chip en" data-lang="en" aria-pressed="false">English</button>
          </div>
        </div>
        <div class="group">
          <h2 data-i="lecH"></h2>
          <div class="chips" id="lectures"></div>
          <p class="note" id="availNote"></p>
        </div>
        <div class="group">
          <h2 data-i="modeH"></h2>
          <div class="modes">
            <button class="mode" data-mode="learn" aria-pressed="true"><strong data-i="m1"></strong><span data-i="m1d"></span></button>
            <button class="mode" data-mode="exam" aria-pressed="false"><strong data-i="m2"></strong><span data-i="m2d"></span></button>
          </div>
        </div>
        <div class="group">
          <h2 data-i="countH" id="countH"></h2>
          <div class="countBox">
            <div class="countRow">
              <button class="stepBtn" id="countMinus" type="button" aria-label="-1">−</button>
              <input class="countInput" id="countInput" type="number" inputmode="numeric" min="10" step="1" aria-labelledby="countH">
              <button class="stepBtn" id="countPlus" type="button" aria-label="+1">+</button>
            </div>
            <input class="countRange" id="countRange" type="range" min="10" step="1" aria-labelledby="countH">
            <div class="rangeEnds"><span id="countMin"></span><span id="countMax"></span></div>
            <div class="chips" id="countQuick"></div>
          </div>
          <p class="note" id="timeNote"></p>
        </div>
        <button class="start" id="startBtn" data-i="start"></button>
        <button class="start secondary" id="summaryBtn" data-i="summaryBtn"></button>
      </div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="bar">
      <div class="pos" id="pos"></div>
      <div class="barside">
        <div class="timer hidden" id="timer"></div>
        <button class="mini" id="langSwitch"></button>
        <button class="quit" id="quitBtn" data-i="quit"></button>
      </div>
    </div>
    <div class="rail" id="rail"></div>
    <div class="card">
      <span class="lecTag" id="lecTag"></span>
      <p class="qtext" id="qtext"></p>
      <div class="opts tf" id="opts"></div>
      <div class="why hidden" id="why"></div>
    </div>
    <div class="confirmBox hidden" id="confirmBox"><p id="confirmMsg"></p><div class="nav"><button class="btn" id="confirmNo"></button><button class="btn main" id="confirmYes"></button></div></div>
    <div class="nav" id="nav"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section id="result" class="hidden">
    <div class="score">
      <div class="big" id="bigScore"></div>
      <p id="pct"></p>
      <p class="verdict" id="verdict"></p>
    </div>
    <div class="tools">
      <h2 data-i="review"></h2>
      <div class="barside">
        <button class="mini" id="langSwitch2"></button>
        <button class="toggle" id="onlyWrong" aria-pressed="false" data-i="onlyWrong"></button>
      </div>
    </div>
    <div class="review" id="review"></div>
    <button class="start again" id="againBtn" data-i="again"></button>
  </section>

  <section id="summary" class="hidden">
    <div class="bar">
      <div class="pos" data-i="summaryTitle"></div>
      <div class="barside">
        <button class="mini" id="langSwitch3"></button>
        <button class="quit" id="summaryBackBtn" data-i="back"></button>
      </div>
    </div>
    <div class="chips" id="sumTabs" style="margin-bottom:18px"></div>
    <div id="summaryContent"></div>
  </section>

</div>

<script>
/* Each item: [statement AR, statement EN, 1=True / 0=False, explanation AR, explanation EN] */

/* ============ Lecture 1: Introduction to Renewable Energy ============ */
const BANK_L1 = [
["تُصنَّف مصادر الطاقة عادةً إلى مصادر تقليدية (Conventional) ومصادر غير تقليدية (Non-conventional).","Energy resources are commonly classified as conventional and non-conventional energy resources.",1,"الشريحة: Energy resources are commonly classified as conventional / non-conventional.","Slide: energy resources are commonly classified as conventional and non-conventional."],
["المصادر غير التقليدية تُعرف أيضًا باسم الوقود الأحفوري.","Non-conventional energy resources are also known as fossil fuels.",0,"المصادر غير التقليدية تُعرف باسم المتجددة (Renewables). الوقود الأحفوري (فحم، بترول، غاز) من المصادر التقليدية.","Non-conventional resources are also known as renewables. Fossil fuels (coal, oil, gas) are conventional."],
["مصادر الطاقة تُستخدم لتوليد الكهرباء والتدفئة والنقل والتطبيقات الصناعية.","Energy resources are used for electricity generation, heating, transportation, and industrial applications.",1,"التعريف: مصادر طبيعية أو مصنّعة نحصل منها على طاقة مفيدة لتوليد الكهرباء والتدفئة والنقل والصناعة.","Definition: natural or engineered sources of useful energy for electricity generation, heating, transportation and industry."],
["المصادر التقليدية هي مصادر استُخدمت على نطاق واسع لعقود، وتشكّل أساس أنظمة الطاقة التقليدية.","Conventional energy resources have been widely used for many decades and form the basis of traditional energy systems.",1,"هذا تعريف الشريحة للمصادر التقليدية حرفيًا.","This is the slide's exact definition of conventional resources."],
["الطاقة النووية مصنّفة في المحاضرة ضمن المصادر غير التقليدية.","Nuclear energy is classified in the lecture as a non-conventional energy resource.",0,"في شريحة التصنيف العام، النووي ضمن المصادر التقليدية مع الفحم والبترول والغاز والطاقة الكهرومائية الكبيرة.","In the general classification slide, nuclear is listed under conventional resources with coal, petroleum, natural gas and large hydropower."],
["في شريحة التصنيف العام، تظهر الطاقة الكهرومائية الكبيرة (Large Hydropower) ضمن المصادر التقليدية.","In the general classification slide, large hydropower appears among the conventional energy resources.",1,"صحيح، لكن ملاحظة الشريحة: ممكن تُصنَّف للنوعين حسب التعريف المعتمد.","True, but as noted on the slide, it can be classified either way depending on the definition used."],
["في السعودية عام 2023، الغاز الطبيعي كان أكبر مصدر لتوليد الكهرباء.","In Saudi Arabia in 2023, natural gas was the largest source of electricity generation.",1,"الغاز الطبيعي 58.2%، النفط 41.1%، الرياح 0.4% (IEA).","Natural gas 58.2%, oil 41.1%, wind 0.4% (IEA)."],
["في السعودية عام 2023، أنتج النفط أكثر من نصف الكهرباء.","In Saudi Arabia in 2023, oil produced more than half of the electricity.",0,"النفط 41.1% فقط. الغاز الطبيعي هو اللي تجاوز النصف (58.2%).","Oil was 41.1%. Natural gas was the one above half (58.2%)."],
["في توليد الكهرباء المتجددة بالسعودية 2023، كان للطاقة الشمسية الكهروضوئية (PV) النصيب الأكبر.","In Saudi Arabia's 2023 renewable electricity generation, solar PV had the largest share.",0,"الرياح 57.2% هي الأكبر، ثم Solar PV بنسبة 37.9%، ثم Solar thermal بنسبة 4.9%.","Wind was the largest at 57.2%, then solar PV at 37.9%, then solar thermal at 4.9%."],
["في توليد الكهرباء المتجددة بالسعودية 2023، كانت الطاقة الشمسية الحرارية (Solar thermal) الأقل نصيبًا.","In Saudi Arabia's 2023 renewable electricity generation, solar thermal had the smallest share.",1,"Solar thermal بنسبة 4.9% مقابل 57.2% للرياح و37.9% لـ PV.","Solar thermal was 4.9% vs. 57.2% wind and 37.9% PV."],
["يُستخدم الفحم بشكل رئيسي لتوليد الكهرباء والصناعات الثقيلة.","Coal is used mainly for electricity generation and heavy industry.",1,"من شريحة Fossil Fuel Resources: Coal is used mainly for electricity generation and heavy industry.","Fossil Fuel Resources slide: coal is used mainly for electricity generation and heavy industry."],
["الفحم يتميز بانبعاثات منخفضة من ثاني أكسيد الكربون.","Coal has low carbon dioxide emissions.",0,"العكس: الفحم High carbon dioxide emissions، ويُنتج رمادًا وملوثات أخرى.","The opposite: coal has high CO₂ emissions and produces ash and other pollutants."],
["البترول وقود رئيسي لقطاع النقل.","Petroleum is a major fuel for transportation.",1,"Petroleum: Major fuel for transportation.","Petroleum: major fuel for transportation."],
["البترول عالي كثافة الطاقة، وسهل النقل والتخزين.","Petroleum has high energy density and is easy to transport and store.",1,"الشريحة: High energy density + Easy to transport and store.","Slide: high energy density; easy to transport and store."],
["الغاز الطبيعي ينتج انبعاثات CO₂ أقل من الفحم لكل وحدة طاقة.","Natural gas has lower CO₂ emissions than coal per unit of energy.",1,"Natural gas: Lower CO₂ emissions than coal per unit of energy.","Natural gas: lower CO₂ emissions than coal per unit of energy."],
["لأن الغاز الطبيعي أقل انبعاثًا من الفحم، فهو لا يُعتبر مصدرًا لانبعاثات غازات الاحتباس الحراري.","Because natural gas emits less CO₂ than coal, it is not considered a source of greenhouse-gas emissions.",0,"الشريحة: Still a fossil fuel and a source of greenhouse-gas emissions.","Slide: it is still a fossil fuel and a source of greenhouse-gas emissions."],

["المصادر التقليدية غير مناسبة للإنتاج المستمر للطاقة.","Conventional resources are unsuitable for continuous energy production.",0,"العكس: من مميزاتها أنها Suitable for continuous energy production.","The opposite: one of their advantages is being suitable for continuous energy production."],

["شدة الإشعاع (Irradiance) وحدتها W/m²، وهي معدل وصول القدرة الإشعاعية لكل وحدة مساحة.","Solar irradiance (W/m²) is the rate at which radiant power is incident on a surface per unit area.",1,"تعريف Solar Irradiance.","Definition of solar irradiance."],
["شدة الإشعاع الشمسي (Irradiance) تُقاس بوحدة kWh/m².","Solar irradiance is measured in kWh/m².",0,"kWh/m² وحدة Insolation (طاقة خلال فترة). Irradiance وحدتها W/m² (قدرة).","kWh/m² is insolation (energy over a period). Irradiance is W/m² (power)."],
["الإشعاع الساقط المتراكم (Insolation) هو مجموع ضوء الشمس خلال فترة زمنية (يوم، شهر، سنة) لكل وحدة مساحة.","Solar insolation (kWh/m²) is the total sunlight over a period of time (day, month or year) per unit area.",1,"تعريف Solar insolation.","Definition of solar insolation."],
["الثابت الشمسي (Solar constant) تقريبًا 1367 W/m².","The solar constant is approximately 1367 W/m².",1,"It is approximately 1367 W/m² in space.","Approximately 1367 W/m² in space."],
["الثابت الشمسي يُقاس على سطح الأرض عند مستوى سطح البحر.","The solar constant is measured on the Earth's surface at sea level.",0,"يُقاس خارج الغلاف الجوي (outside the Earth's atmosphere) على سطح عمودي على الأشعة.","It's defined outside the atmosphere, on a surface perpendicular to the rays."],
["الثابت الشمسي معرّف عند متوسط المسافة بين الأرض والشمس، على سطح عمودي على أشعة الشمس.","The solar constant is defined at the mean Earth–Sun distance on a surface perpendicular to the Sun's rays.",1,"التعريف: a unit plane surface perpendicular to the Sun's rays… at its mean distance from the Sun.","Definition: unit plane surface perpendicular to the rays, at mean Earth–Sun distance."],
["الكتلة الهوائية (Air Mass) مقياس لكمية الغلاف الجوي اللي تعبرها أشعة الشمس قبل ما توصل سطح الأرض.","Air mass is a measure of how much atmosphere the Sun's rays pass through to reach the Earth's surface.",1,"تعريف Air Mass.","Definition of air mass."],
["كلما زادت الكتلة الهوائية، زادت الطاقة الشمسية الواصلة لنا.","The higher the air mass, the more solar energy we receive.",0,"العكس: كلما زاد الغلاف الجوي اللي تعبره الأشعة، قلّت الطاقة الواصلة.","The opposite: more atmosphere → more absorption and scattering → less energy."],
["لما تكون الشمس عمودية تمامًا (الزاوية = 0°)، الكتلة الهوائية AM1.0.","When the Sun is directly overhead (angle = 0°), the air mass is AM1.0.",1,"من الجدول: φ = 0 → 1/cos φ = 1 → AM1.0.","Table: φ = 0 → 1/cos φ = 1 → AM1.0."],
["AM1.5 تقابل زاوية حوالي 48.2°.","AM1.5 corresponds to an angle of about 48.2°.",1,"من الجدول: 48.2° → 1/cos = 1.5 → AM1.5..","Table: 48.2° → 1/cos = 1.5 → AM1.5."],
["عند زاوية 60°، الكتلة الهوائية AM1.0.","At an angle of 60°, the air mass is AM1.0.",0,"1/cos(60°) = 2 → AM2.0.","1/cos(60°) = 2 → AM2.0."],
["الاعتدال (Equinox) يحدث أربع مرات في السنة.","The equinox occurs four times a year.",0,"Equinox occurs twice a year (مارس وسبتمبر).","The equinox occurs twice a year (March and September)."],
["في الاعتدال، تكون الشمس عمودية فوق نقطة على خط الاستواء.","At the equinox, the Sun is vertically above a point on the Equator.",1,"تعريف Equinox: the Sun being vertically above a point on the Equator.","Definition: the Sun is vertically above a point on the Equator."],
["في الاعتدال، يكون محور الأرض مائلًا باتجاه الشمس.","At the equinox, the Earth's axis is tilted towards the Sun.",0,"في الاعتدال المحور غير مائل لا باتجاه الشمس ولا بعيدًا عنها.","At the equinox the axis is inclined neither away from nor towards the Sun."],
["في الانقلاب الصيفي (21–22 يونيو)، يكون الإشعاع الشمسي الواصل أكبر في نصف الكرة الشمالي.","At the summer solstice (June 21–22), incoming solar energy is greatest in the Northern Hemisphere.",1,"Summer Solstice June 21–22: Incoming solar energy greatest in Northern Hemisphere.","Summer solstice, June 21–22: incoming solar energy greatest in the Northern Hemisphere."],
["في الانقلاب الشتوي (21–22 ديسمبر)، يكون الإشعاع الشمسي الواصل أكبر في نصف الكرة الشمالي.","At the winter solstice (December 21–22), incoming solar energy is greatest in the Northern Hemisphere.",0,"في الانقلاب الشتوي يكون أكبر في نصف الكرة الجنوبي.","At the winter solstice it is greatest in the Southern Hemisphere."],
["الاعتدال الربيعي يكون في 21–22 مارس، والاعتدال الخريفي في 22–23 سبتمبر.","The vernal equinox is on March 21–22 and the autumnal equinox on September 22–23.",1,"من رسم مدار الأرض. في الاثنين يتساوى الإشعاع في النصفين.","From the orbit diagram; at both, incoming solar energy is equal in both hemispheres."],
["مسار الشمس (Sun path) هو المسار القوسي اليومي والموسمي اللي تظهر الشمس تتحرك فيه بالسماء.","Sun path is the daily and seasonal arc-like path the Sun appears to follow across the sky.",1,"تعريف Sun path.","Definition of sun path."],
["في نصف الكرة الشمالي، مسار الشمس في الصيف أخفض في السماء من مسارها في الشتاء.","In the Northern Hemisphere, the summer sun path is lower in the sky than the winter sun path.",0,"العكس: مسار الصيف أعلى وأطول، ومسار الشتاء أخفض.","The opposite: the summer path is higher and longer; the winter path is lower."],
["ساعات ذروة الشمس (Peak sun hours) هي عدد الساعات المكافئة يوميًا اللي يكون فيها متوسط الإشعاع 1000 W/m².","Peak sun hours is the equivalent number of hours per day when irradiance averages 1000 W/m².",1,"تعريف Peak sun hours.","Definition of peak sun hours."],
["إذا كان الإشعاع 500 W/m² لمدة 4 ساعات و250 W/m² لمدة 6 ساعات، فساعات الذروة = 3.5.","If irradiance is 500 W/m² for 4 hours and 250 W/m² for 6 hours, peak sun hours = 3.5.",1,"(4×500 + 6×250) / 1000 = 3500/1000 = 3.5.","(4×500 + 6×250) / 1000 = 3.5."],
["إذا كان الإشعاع 1000 W/m² لمدة ساعتين و500 W/m² لمدة 4 ساعات، فساعات الذروة = 6.","If irradiance is 1000 W/m² for 2 hours and 500 W/m² for 4 hours, peak sun hours = 6.",0,"(2×1000 + 4×500) / 1000 = 4 وليس 6. لا تجمع الساعات مباشرة.","(2×1000 + 4×500) / 1000 = 4, not 6. Don't just add the hours."],
["معظم بيانات الإشعاع الشمسي تُعرض بوحدة ساعات ذروة الشمس.","Most solar irradiation data is presented in peak sun hours.",1,"Most solar irradiation data is presented in Peak Sun Hours.","Stated directly on the slide."],
["إذا كانت ساعات الذروة في يوم ما 6، فهذا يعني أن السطح استقبل إشعاعًا كليًا مكافئًا لـ 6000 Wh/m² في ذلك اليوم.","6 peak sun hours in a day means the surface received total radiation equivalent to 6000 Wh/m² that day.",1,"6 × 1000 = 6000. (الشريحة كتبتها 6000 W/m² لكن المقصود المجموع خلال اليوم.)","6 × 1000 = 6000 (the slide writes '6000 W/m2', meaning the daily total)."],
["في مكة، أعلى إشعاع شهري (Insolation) يكون في يونيو.","In Mecca, the highest monthly insolation is in June.",1,"يونيو 7.07 kWh/m²/day وهو الأعلى في جدول NASA.","June: 7.07 kWh/m²/day, the highest in the NASA table."],
["في مكة، أعلى إشعاع شهري يكون في ديسمبر.","In Mecca, the highest monthly insolation is in December.",0,"ديسمبر 3.78 وهو الأقل. الأعلى يونيو بـ 7.07.","December (3.78) is the lowest; the highest is June (7.07)."],
["الغيوم تقلل الإشعاع الكلي على السطح الأفقي وتجعله متذبذبًا مقارنةً باليوم الصافي.","Clouds reduce total radiation on a horizontal surface and make it fluctuate compared with a clear day.",1,"رسم Effect of Clouds: منحنى اليوم الصافي ناعم ويوصل ~700 W/m²، واليوم الغائم أقل وغير منتظم.","Effect of Clouds figure: the clear day is smooth (~700 W/m² peak); the cloudy day is lower and erratic."],
["خط العرض (Latitude) يتراوح من 0° عند خط الاستواء إلى 90° عند القطبين.","Latitude ranges from 0° at the equator to 90° at the poles.",1,"تعريف Latitude.","Definition of latitude."],
["خط العرض يتراوح من 0° إلى 180°.","Latitude ranges from 0° to 180°.",0,"خط العرض إلى 90° فقط. اللي يوصل 180° هو خط الطول (Longitude).","Latitude goes up to 90°. Longitude is the one that reaches 180°."],
["خط الطول (Longitude) يبدأ من 0° عند خط غرينتش، ويصل إلى +180° شرقًا و−180° غربًا.","Longitude ranges from 0° at the Prime Meridian to +180° eastward and −180° westward.",1,"تعريف Longitude.","Definition of longitude."],
["القطب الجنوبي يُكتب +90°.","The South Pole is written as +90°.",0,"القطب الجنوبي 90° S أو −90°. القطب الشمالي هو +90°.","The South Pole is 90° S or −90°; the North Pole is +90°."],
["التوقيت الشمسي يعتمد على الحركة الزاوية الظاهرية للشمس، والظهر الشمسي يكون لما تعبر الشمس خط زوال الراصد.","Solar time is based on the Sun's apparent angular motion; solar noon occurs when the Sun crosses the observer's meridian.",1,"تعريف Solar time.","Definition of solar time."],
["التوقيت الشمسي يساوي دائمًا وقت الساعة المحلي.","Solar time always equals local clock time.",0,"Solar time… does not correspond with clock time. ممكن يكون قبله أو بعده.","Solar time does not correspond with clock time."],
["الرقم 4 في معادلة التوقيت الشمسي يعني 4 دقائق لكل درجة من دوران الأرض.","The '4' in the solar time equation means 4 minutes per degree of Earth rotation.",1,"Solar time − standard time = 4(Lst − Lloc) + E؛ ‘4’ refers to 4 minutes per degree.","'4' refers to 4 minutes per degree of Earth rotation."],
["E في معادلة التوقيت الشمسي هي معادلة الزمن (Equation of time) بالدقائق.","E in the solar time equation is the equation of time, in minutes.",1,"The parameter E is the equation of time (in minutes)، من الرسم أو من المعادلة.","E is the equation of time in minutes, from the chart or formula."],
["في مثال Madison: الساعة 10:30 صباحًا بالتوقيت القياسي تقابل 10:19 صباحًا بالتوقيت الشمسي.","In the Madison example, 10:30 a.m. standard time corresponds to 10:19 a.m. solar time.",1,"4(90 − 89.4) + (−13.5) ≈ −11 min → 10:19.","4(90 − 89.4) + (−13.5) ≈ −11 min → 10:19 a.m."],
["في مثال Madison، التصحيح على التوقيت القياسي كان +11 دقيقة.","In the Madison example, the correction to standard time was +11 minutes.",0,"التصحيح −11 دقيقة (2.4 − 13.5)، لذلك صار الوقت 10:19 وليس 10:41.","The correction was −11 min (2.4 − 13.5), giving 10:19, not 10:41."],
["زاوية الميل الشمسي (Declination) هي الزاوية بين أشعة الشمس ومستوى خط الاستواء.","The declination angle is the angle between the Sun's rays and the Earth's equatorial plane.",1,"تعريف δ.","Definition of δ."],
["زاوية الميل الشمسي تتراوح تقريبًا بين −23.45° و+23.45°.","The declination angle varies approximately from −23.45° to +23.45°.",1,"Varies approximately from −23.45° to +23.45°.","Stated on the slide."],
["زاوية الميل الشمسي ثابتة طوال السنة.","The declination angle is constant throughout the year.",0,"Changes throughout the year.","It changes throughout the year."],
["معادلة الميل الشمسي: δ = 23.45° sin[(360/365)(284 + n)]، حيث n رقم اليوم في السنة.","Declination: δ = 23.45° sin[(360/365)(284 + n)], where n is the day of the year.",1,"المعادلة في الشريحة.","The formula on the slide."],
["زاوية الساعة: ω = 15° (ts − 12).","Hour angle: ω = 15° (ts − 12).",1,"15° لكل ساعة، وts هو التوقيت الشمسي.","15° per hour; ts is solar time."],
["عند الظهر الشمسي، زاوية الساعة ω = 0°.","At solar noon, the hour angle ω = 0°.",1,"Solar noon: ω = 0°.","Solar noon: ω = 0°."],
["في الصباح تكون زاوية الساعة موجبة (ω > 0).","In the morning, the hour angle is positive (ω > 0).",0,"الصباح ω < 0، وبعد الظهر ω > 0.","Morning: ω < 0; afternoon: ω > 0."],
["الساعة 15:00 بالتوقيت الشمسي، زاوية الساعة = +45°.","At 15:00 solar time, the hour angle = +45°.",1,"15 × (15 − 12) = +45°.","15 × (15 − 12) = +45°."],
["الساعة 09:00 بالتوقيت الشمسي، زاوية الساعة = +45°.","At 09:00 solar time, the hour angle = +45°.",0,"15 × (9 − 12) = −45°.","15 × (9 − 12) = −45°."],
["زاوية الارتفاع الشمسي (Altitude) تساوي 0° عند الأفق و90° لما تكون الشمس فوق الرأس مباشرة.","Solar altitude is 0° at the horizon and 90° when the Sun is overhead.",1,"تعريف α.","Definition of α."],
["زاوية السمت الرأسي (Zenith) وزاوية الارتفاع متتامتان: θz + α = 90°.","Zenith and altitude are complementary: θz + α = 90°.",1,"Altitude and zenith are complementary angles.","Altitude and zenith are complementary angles."],
["إذا كانت زاوية الارتفاع 30°، فزاوية Zenith = 30°.","If the altitude angle is 30°, the zenith angle is 30°.",0,"θz = 90 − 30 = 60°.","θz = 90 − 30 = 60°."],
["إذا كانت زاوية الارتفاع 40°، فزاوية Zenith = 50°.","If the altitude angle is 40°, the zenith angle is 50°.",1,"θz = 90 − 40 = 50°.","θz = 90 − 40 = 50°."],
["زاوية Zenith هي الزاوية بين أشعة الشمس والمستوى الأفقي.","The zenith angle is the angle between the Sun's rays and the horizontal plane.",0,"هذا تعريف Altitude. الـ Zenith بين الأشعة والاتجاه الرأسي (vertical).","That's altitude. Zenith is between the rays and the vertical."],
["زاوية السمت (Azimuth) تصف الاتجاه الأفقي (البوصلي) للشمس.","The solar azimuth angle describes the horizontal (compass) direction of the Sun.",1,"تعريف γs.","Definition of γs."],
["زاوية السمت (Azimuth) ثابتة طوال اليوم.","The solar azimuth angle stays constant during the day.",0,"Changes continuously during the day، وتعتمد على الموقع والتاريخ والتوقيت الشمسي.","It changes continuously during the day and depends on location, date and solar time."],
["التوجيه الجيد للألواح يقلل زاوية السقوط ويزيد الإشعاع المباشر المستقبَل.","Good orientation reduces the incidence angle and increases received beam radiation.",1,"Good orientation reduces the incidence angle and increases received beam radiation.","Stated on the azimuth slide."],
["زاوية الميل (Tilt) β = 0° للسطح الأفقي و90° للسطح الرأسي.","Tilt β = 0° for a horizontal surface and 90° for a vertical surface.",1,"تعريف β.","Definition of β."],
["زاوية الميل β = 0° تعني أن السطح رأسي.","A tilt angle β = 0° means the surface is vertical.",0,"β = 0° سطح أفقي، وβ = 90° سطح رأسي.","β = 0° is horizontal; β = 90° is vertical."],
["زاوية السقوط (Incidence) θ هي الزاوية بين الشعاع الشمسي والعمودي على السطح (Surface normal).","The angle of incidence θ is the angle between the solar beam and the surface normal.",1,"تعريف θ.","Definition of θ."],
["عندما θ = 90°، يسقط الشعاع عموديًا على اللوح.","When θ = 90°, the beam strikes the collector perpendicularly.",0,"عندما θ = 0° يسقط الشعاع عموديًا على اللوح.","The beam is perpendicular when θ = 0°."],
["كلما كبرت زاوية السقوط θ، زاد الإشعاع المباشر على السطح.","A larger incidence angle θ gives greater beam radiation on the surface.",0,"العكس: Smaller θ generally gives greater beam radiation. كل ما قلّت كان أفضل.","The opposite: a smaller θ generally gives greater beam radiation."],
["الإشعاع الكلي على سطح مائل: IG = rb·Ib,h + rd·Id,h + rr·(Ib,h + Id,h).","Global radiation on a tilted surface: IG = rb·Ib,h + rd·Id,h + rr·(Ib,h + Id,h).",1,"المعادلة في الشريحة.","The formula on the slide."],
["rb هو معامل الميل للإشعاع المباشر، ويساوي cosθ / cosθz.","rb is the tilt factor for beam radiation and equals cosθ / cosθz.",1,"rb = cosθ / cosθz.","rb = cosθ / cosθz."],
["rr هو معامل الميل للإشعاع المنتشر.","rr is the tilt factor for diffuse radiation.",0,"rr للانعكاس الأرضي (ground reflection). rd هو للإشعاع المنتشر.","rr is for ground reflection; rd is for diffuse."],
["ρ في معادلة rr تمثل انعكاسية الأرض (Ground reflectivity).","ρ in the rr equation is the ground reflectivity.",1,"rr = ρ(1 − cosβ)/2، وρ = Ground reflectivity.","rr = ρ(1 − cosβ)/2, ρ = ground reflectivity."],
["للسطح الأفقي (β = 0°): rb = 1 وrd = 1 وrr = 0.","For a horizontal surface (β = 0°): rb = 1, rd = 1 and rr = 0.",1,"لذلك IG,h = Ib,h + Id,h. ما فيه انعكاس لأنه ما فيه جسم ينعكس عليه.","So IG,h = Ib,h + Id,h; no reflected component."],
["للسطح الأفقي، معامل الانعكاس الأرضي rr = 1.","For a horizontal surface, the ground-reflection factor rr = 1.",0,"rr = ρ(1 − cos0)/2 = 0.","rr = ρ(1 − cos0)/2 = 0."],
["جهاز Pyranometer يوضع أفقيًا لاستبعاد الإشعاع المنعكس من الأرض.","The pyranometer is placed horizontally to discard the radiation reflected from the ground.",1,"Pyranometer is placed horizontally to discard the reflected radiation from ground.","Stated on the slide."],
["جهاز Pyranometer يقيس شدة الإشعاع الشمسي من مجال رؤية نصف كروي بزاوية 180°.","A pyranometer measures solar irradiance from a 180° hemispherical field of view.",1,"تعريف Pyranometer، والقياس بوحدة W/m².","Definition of the pyranometer (W/m²)."],
["جهاز Pyranometer يقيس الإشعاع المباشر فقط من خلال فتحة صغيرة زاويتها 5°.","A pyranometer measures only direct beam radiation through a small 5° aperture.",0,"هذا وصف Pyrheliometer. الـ Pyranometer مجال رؤيته 180°.","That's the pyrheliometer. The pyranometer has a 180° field of view."],
["حلقة الظل (Shade ring) تحجب الإشعاع المباشر عن الحساس طوال اليوم، فيقيس الجهاز الإشعاع المنتشر فقط.","A shade ring blocks direct sunlight from the sensor all day so the instrument measures only diffuse radiation.",1,"تعريف Pyranometer shade ring.","Definition of the pyranometer shade ring."],
["حلقة الظل تحجب الإشعاع المنتشر، فيقيس الجهاز الإشعاع المباشر فقط.","A shade ring blocks diffuse radiation so the instrument measures only direct beam radiation.",0,"العكس: تحجب المباشر ليقيس المنتشر (diffuse) فقط.","The opposite: it blocks direct sunlight to measure only diffuse."],
["جهاز Sunshine recorder يقيس مدة سطوع الشمس في موقع معين خلال فترة زمنية.","A sunshine recorder measures the duration of bright sunshine at a location over a period of time.",1,"تعريف Sunshine recorder.","Definition of the sunshine recorder."],
["جهاز Sunshine recorder يقيس شدة الإشعاع الشمسي بوحدة W/m².","A sunshine recorder measures solar irradiance in W/m².",0,"يقيس المدة (duration) وليس الشدة.","It measures duration, not intensity."],
["جهاز Pyrheliometer يقيس الإشعاع المباشر العمودي (DNI) بوحدة W/m².","A pyrheliometer measures Direct Normal Irradiance (DNI) in W/m².",1,"تعريف Pyrheliometer.","Definition of the pyrheliometer."],
["جهاز Pyrheliometer له مجال رؤية واسع بزاوية 180°.","A pyrheliometer has a wide 180° field of view.",0,"فتحته صغيرة (View = 5°) ويقيس المباشر فقط. الـ 180° للـ Pyranometer.","It has a small aperture (view = 5°). The 180° view belongs to the pyranometer."],
["اللوح الكهروضوئي (PV module) يحوّل الطاقة الشمسية إلى كهرباء تيار مستمر (DC).","A photovoltaic module converts solar energy into DC electricity.",1,"A photovoltaic module converts solar energy into DC electricity.","Stated on the slide."],
["اللوح الكهروضوئي ينتج تيارًا مترددًا (AC) مباشرة.","A PV module directly produces AC electricity.",0,"ينتج DC. جهاز تحكم (inverter) هو اللي يحوّله لاستخدام الأجهزة.","It produces DC; a control device converts it for appliances."],
["إنتاج الكهرباء من الألواح الشمسية يتغير خلال اليوم ومع الطقس.","PV power generation changes during the day and with the weather.",1,"Less solar energy → less electricity; More solar energy → more electricity.","Less solar energy → less electricity; more → more."]
];

["خلايا البوليمر والعضوية (Organic PV) أعلى كفاءة من خلايا السيليكون.","Polymer and organic PV cells are more efficient than silicon cells.",0,"أقل بكثير: حوالي ثلث كفاءة خلية السيليكون، وعمرها أقصر، لكنها خفيفة الوزن.","Much less: about 1/3 of a typical Si cell, with shorter life, but lightweight."],
["الخلية الشمسية (Solar cell) هي أصغر وحدة كهروضوئية تحوّل ضوء الشمس إلى كهرباء DC.","A solar cell is the smallest PV unit that converts sunlight into DC electricity.",1,"تعريف Solar cell.","Definition of a solar cell."],
["المصفوفة (PV array) هي أصغر وحدة في النظام الكهروضوئي.","A PV array is the smallest unit in a PV system.",0,"الترتيب: Cell ← Module ← Panel ← Array. المصفوفة هي الأكبر.","Order: cell → module → panel → array. The array is the largest."],
["عدد الألواح في المصفوفة يُختار حسب قدرة النظام المطلوبة ومستوى الجهد والحمل.","The number of modules in an array is selected according to required power, voltage level and load demand.",1,"العبارة تحت رسم Cell/Module/Panel/Array.","Stated under the cell/module/panel/array figure."],
["الإطار الألمنيوم يحمي حافة الطبقات ويوفّر هيكلًا صلبًا لتركيب اللوح.","The aluminum frame protects the laminate edge and provides a solid structure for mounting.",1,"1- Aluminum Frame.","1- Aluminum frame."],
["الزجاج الأمامي المقسّى في اللوح سماكته حوالي 3–4 مم.","The tempered front glass of a module is about 3–4 mm thick.",1,"Tempered Glass (3–4 mm Thick): يحمي من الطقس والبَرَد والحطام.","Tempered glass (3–4 mm): protects from weather, hail and debris."],
["طبقة EVA معتمة وتستخدم لعزل اللوح كهربائيًا من الخلف.","The EVA film is opaque and used to electrically insulate the module from the back.",0,"EVA بوليمر شفاف جدًا يغلّف الخلايا ويثبتها ويمنع دخول الرطوبة والأوساخ. العزل الخلفي وظيفة Back sheet.","EVA is a highly transparent polymer that encapsulates the cells; back insulation is the back sheet's job."],
["الطبقة الخلفية (Back sheet) حاجز للرطوبة وتوفر حماية ميكانيكية وعزلًا كهربائيًا.","The back sheet is a moisture barrier providing mechanical protection and electrical insulation.",1,"5- Back sheet.","5- Back sheet."],
["صندوق التوصيل (Junction box) يحتوي على الدايودات الجانبية (Bypass diodes).","The junction box houses the bypass diodes.",1,"يمنع التيار العكسي اللي يصير لما تتظلل الخلايا أو تتسخ.","They prevent back current when cells are shaded or dirty."],
["ظروف الاختبار القياسية (STC): 1000 W/m²، و25°C، وAM1.5.","Standard Test Conditions (STC) are 1000 W/m², 25 °C and AM1.5.",1,"STC كما في الشريحة.","STC as on the slide."],
["ظروف الاختبار القياسية تعتمد درجة حرارة الخلية 45°C.","Standard Test Conditions use a cell temperature of 45 °C.",0,"STC = 25°C.","STC = 25 °C."],
["في منحنيات I-V، كلما قل الإشعاع قلّ التيار والقدرة القصوى.","In the I-V curves, lower irradiance gives lower current and lower maximum power.",1,"من 1000 W/m² بـ 75 Wmax إلى 200 W/m² بـ 15 Wmax.","From 1000 W/m² (75 Wmax) down to 200 W/m² (15 Wmax)."],
["جهد الدائرة المفتوحة (Voc) هو أقصى جهد تنتجه الخلية الشمسية.","Open circuit voltage (Voc) is the maximum voltage a solar cell produces.",1,"ويعتمد بشكل رئيسي على تقنية الخلية ودرجة حرارة التشغيل.","It mainly depends on cell technology and operating temperature."],
["تيار القصر (Isc) هو أقصى تيار تنتجه الخلية الشمسية.","Short circuit current (Isc) is the maximum current a solar cell can produce.",1,"ويعتمد على تقنية الخلية ومساحتها والإشعاع وزاوية الخلية.","It depends on cell technology, area, radiation and cell angle."],
["كثافة تيار القصر Jsc = Isc × A.","Short circuit current density Jsc = Isc × A.",0,"قسمة وليس ضرب: Jsc = Isc / A.","Divide, not multiply: Jsc = Isc / A."],
["الجهد عند نقطة القدرة القصوى (Vm) دائمًا أقل من Voc.","The voltage at the maximum power point (Vm) is always lower than Voc.",1,"The Vm will always be lower than Voc.","Stated on the slide."],
["التيار عند نقطة القدرة القصوى (Im) دائمًا أكبر من Isc.","The current at the maximum power point (Im) is always higher than Isc.",0,"العكس: Im دائمًا أقل من Isc.","The opposite: Im is always lower than Isc."],
["معامل التعبئة FF = (Im × Vm) / (Isc × Voc).","Fill factor FF = (Im × Vm) / (Isc × Voc).",1,"وتساوي أيضًا Pm / (Isc × Voc).","Also equal to Pm / (Isc × Voc)."],
["الكفاءة η = Pm / Pin، وPin في ظروف STC تساوي 1000 W/m².","Efficiency η = Pm / Pin, with Pin at STC taken as 1000 W/m².",1,"η = Pm/Pin = (Isc × Voc × FF)/(Pin × A).","η = Pm/Pin = (Isc × Voc × FF)/(Pin × A)."],
["عند توصيل الخلايا على التوالي، الجهد الكلي = مجموع الجهود، والتيار نفسه.","In series, the total voltage is the sum of the cell voltages and the current stays the same.",1,"Solar Cells or Modules in Series.","Solar cells or modules in series."],
["عند توصيل الخلايا على التوازي، الجهد الكلي = مجموع الجهود.","In parallel, the total voltage is the sum of the cell voltages.",0,"على التوازي: الجهد ثابت، والتيار الكلي = مجموع التيارات.","In parallel: voltage stays the same; total current is the sum."],
["36 خلية على التوالي، كل خلية 0.5 V، الجهد الكلي = 18 V.","36 cells in series at 0.5 V each give a total of 18 V.",1,"36 × 0.5 = 18 V.","36 × 0.5 = 18 V."],
["72 خلية على التوالي (0.695 V، 5.25 A) موصولة على التوازي مع جزء مماثل: الجهد ≈ 50 V والتيار = 10.5 A.","72 series cells (0.695 V, 5.25 A) in parallel with an identical part: voltage ≈ 50 V and current = 10.5 A.",1,"72 × 0.695 ≈ 50 V، و5.25 × 2 = 10.5 A، والقدرة ≈ 50 × 10.5 = 525 W.","72 × 0.695 ≈ 50 V; 5.25 × 2 = 10.5 A; power ≈ 525 W."],
["في المثال نفسه (72 خلية على التوازي مع جزء مماثل)، الجهد الكلي ≈ 100 V.","In the same example (72 cells in parallel with an identical part), the total voltage ≈ 100 V.",0,"التوازي ما يضاعف الجهد. الجهد ≈ 50 V، والتيار هو اللي يتضاعف إلى 10.5 A.","Parallel doesn't double voltage. It stays ≈ 50 V; the current doubles to 10.5 A."],
["لوح 180 W (23.26 V) ولوح 375 W (44.5 V) على التوالي: الجهد الكلي = 67.76 V.","A 180 W (23.26 V) and a 375 W (44.5 V) module in series give a total of 67.76 V.",1,"23.26 + 44.5 = 67.76 V.","23.26 + 44.5 = 67.76 V."],
["عند توصيل ألواح مختلفة على التوالي، التيار الكلي يساوي أكبر تيار بينها.","When different modules are connected in series, the total current equals the highest current.",0,"يساوي أقل تيار (the lowest current)، لذلك في المثال كان ~9 A.","It equals the lowest current, so ~9 A in the example."],
["عند توصيل ألواح مختلفة على التوازي: الجهد الكلي = أقل جهد، والتيار الكلي = مجموع التيارات.","For different modules in parallel: total voltage = the lowest voltage, total current = the sum of currents.",1,"Lowest voltage is the total, and the sum of the current is the total.","Stated on the slide."],
["الألواح الكهروضوئية حساسة جدًا للتظليل، وممكن تخسر حتى 90% من إنتاجها.","PV modules are very sensitive to shading and could lose up to 90% of their output.",1,"Shading slide.","Shading slide."],
["فضلات الطيور والغبار من أمثلة التظليل الصلب (Hard shading).","Bird droppings and dust are examples of hard shading.",1,"من رسم Subjective Shading: Hard shading = Bird droppings، dust. وSoft shading = ظل عمود.","Subjective shading figure: hard = bird droppings, dust; soft = a pole's shadow."],
["التوصيل على التوالي أفضل من التوازي في حالة التظليل.","Series wiring is better than parallel wiring under shading.",0,"التوازي أفضل: الخسارة تبقى محصورة في السلسلة المظللة، أما التوالي فيقلل إنتاج المصفوفة كلها.","Parallel is better: losses stay in the shaded string; series reduces the whole array's output."],
["الخلية المظللة في سلسلة ممكن تصير حِمْلًا على باقي الخلايا وتسخن مكوّنة نقاط ساخنة (Hot spots).","A shaded cell in a series string can become a load for the other cells and heat up, forming hot spots.",1,"Shading Causes Hot Spots.","Shading causes hot spots."],
["النقاط الساخنة ممكن تكسر الزجاج، وفي أسوأ الحالات تسبب حريقًا.","Hot spots can break the glass cover and, in the worst case, cause fire.",1,"The hot spots sometimes can give rise to breaking of glass cover… or… fire.","Stated on the slide."],
["الدايود الجانبي (Bypass diode) يُوصل على التوالي مع الخلايا وبنفس قطبيتها.","A bypass diode is connected in series with the cells with the same polarity.",0,"يُوصل على التوازي مع الخلايا وبقطبية معاكسة.","It is connected in parallel with the cells, with opposite polarity."],
["في الحالة الطبيعية بدون تظليل، يعمل الدايود الجانبي في انحياز عكسي (كدائرة مفتوحة).","In normal (unshaded) conditions, the bypass diode operates in reverse bias, effectively open circuit.",1,"ولما تتظلل خلية، يصير الانحياز أماميًا ويمرر الدايود التيار بدل الخلية المظللة.","When a cell is shaded, it becomes forward-biased and carries the current instead."],
["عمليًا، يُنصح بدايود جانبي واحد على الأقل لكل 10–15 خلية على التوالي.","In practice, at least one bypass diode is recommended for every 10–15 series cells.",1,"مثاليًا دايود لكل خلية، لكن عمليًا ولأسباب التكلفة: واحد لكل 10–15 خلية.","Ideally one per cell, but for cost: one per 10–15 cells."],
["في التتبع أحادي المحور، محور الدوران ممكن يكون شمال–جنوب أو شرق–غرب.","In one-axis tracking, the axis of rotation can be north–south or east–west.",1,"One-axis tracking.","One-axis tracking."],
["النظام الكهروضوئي الكامل يتكون من الألواح فقط.","A complete PV system consists of the PV modules only.",0,"يحتوي مكونات كهربائية وميكانيكية: المصفوفة، هيكل التركيب، منظم الشحن، البطاريات، الإنفرتر، وأجهزة الحماية.","It includes electrical and mechanical parts: array, mounting, charge controller, batteries, inverter, protection."],
["هيكل التركيب (Mounting structure) يدعم الألواح ويثبّت زاوية الميل.","The mounting structure supports the modules and fixes the tilt angle.",1,"Mounting structure.","Mounting structure."],
["المصهرات والقواطع والفواصل والتأريض والحماية من التيار المفاجئ من أجهزة الحماية في النظام.","Fuses, breakers, disconnects, grounding and surge protection are the system's protection devices.",1,"Protection devices.","Protection devices."],
["منظم الشحن (Charge controller) ينظّم تدفق القدرة بين المصفوفة والبطارية والحمل.","A charge controller regulates power flow between the PV array, battery and load.",1,"تعريف Charge controller.","Definition of the charge controller."],
["منظم الشحن يحوّل الكهرباء من DC إلى AC.","The charge controller converts DC electricity to AC.",0,"هذا عمل الإنفرتر (Inverter). منظم الشحن يحمي البطارية وينظم الشحن.","That's the inverter's job. The controller protects the battery and regulates charging."],
["من وظائف منظم الشحن منع الشحن الزائد ومنع التفريغ العميق للبطارية.","A charge controller prevents overcharging and deep battery discharge.",1,"Main functions.","Main functions."],
["منظم الشحن يمنع التيار العكسي في الليل.","A charge controller blocks reverse current at night.",1,"Blocks reverse current at night.","Blocks reverse current at night."],
["منظم الشحن غير مطلوب في معظم الأنظمة المستقلة اللي فيها بطاريات.","A charge controller is not required in most stand-alone PV systems with battery storage.",0,"العكس: It is required in most stand-alone PV systems with battery storage.","The opposite: it is required in most stand-alone systems with batteries."],
["بدون تحكم صحيح في الشحن، ممكن تفقد البطاريات سعتها بسرعة أو تتلف مبكرًا.","Without proper charge control, batteries can lose capacity quickly or fail prematurely.",1,"العبارة تحت صورة المنظم.","Stated under the controller image."],
["PWM تعني Pulse Width Modulation.","PWM stands for Pulse Width Modulation.",1,"PWM = Pulse Width Modulation.","PWM = Pulse Width Modulation."],
["منظم PWM يستخدم تشغيل/إطفاء سريع للتحكم في متوسط تيار الشحن، ويقلل التيار لما تمتلئ البطارية.","A PWM controller uses rapid ON/OFF switching to control average charging current and reduces it as the battery fills.",1,"How It Works.","How it works."],
["في منظم PWM، جهد تشغيل الألواح يكون أعلى بكثير من جهد البطارية.","In a PWM controller, the PV operating voltage is much higher than the battery voltage.",0,"The PV operating voltage is pulled close to the battery voltage.","The PV operating voltage is pulled close to the battery voltage."],
["MPPT يشغّل اللوح قرب نقطة القدرة القصوى، حيث حاصل ضرب الجهد في التيار أكبر ما يمكن.","MPPT operates the module near the maximum power point, where voltage × current is maximum.",1,"MPPT Charge Controller.","MPPT charge controller."],
["MPPT مفيد خصوصًا لما يتغير الإشعاع الشمسي خلال اليوم.","MPPT is especially useful when solar radiation changes during the day.",1,"MPPT is especially useful when solar radiation changes during the day.","Stated on the slide."],
["منظم MPPT أرخص من PWM.","An MPPT controller is cheaper than a PWM controller.",0,"MPPT تكلفته أعلى، لكن يعطي طاقة أكثر من نفس المصفوفة.","MPPT costs more but harvests more energy from the same array."],
["منظم PWM مناسب للأنظمة الصغيرة البسيطة، وMPPT للأنظمة الكبيرة أو الظروف المتغيرة.","PWM suits small, simple systems; MPPT suits larger systems or variable conditions.",1,"جدول PWM vs. MPPT، صف Best use.","PWM vs. MPPT table, Best use row."],
["منظم MPPT يقدر يستخدم جهد ألواح أعلى من جهد البطارية لأنه يعتمد على تحويل DC-DC.","An MPPT controller can use a higher PV voltage than the battery because it uses DC-DC conversion.",1,"جدول المقارنة: Uses DC-DC conversion؛ Can use higher PV voltage than battery.","Comparison table: DC-DC conversion; can use higher PV voltage than battery."],
["في الليل أو الجو الغائم، البطارية تغذي الحمل ومنظم الشحن يمنع التفريغ العميق.","At night or in cloudy weather, the battery supplies the load and the controller prevents deep discharge.",1,"How MPPT, Controller and Battery Work Together.","How MPPT, controller and battery work together."],
["صندوق التجميع (Combiner box) يجمع أسلاك السلاسل في مخرج كهربائي واحد يذهب لمنظم الشحن أو الإنفرتر.","The combiner box combines all string wires into one output fed to the charge controller or inverter.",1,"Combiner Box.","Combiner box."],
["البطارية تخزن الطاقة الكهربائية على شكل طاقة كيميائية.","A battery stores electrical energy in the form of chemical energy.",1,"وعند الاستخدام تتحول الطاقة الكيميائية إلى كهربائية.","When used, the chemical energy is converted back into electrical energy."],
["عملية استهلاك الطاقة من البطارية تسمى «الشحن» (Charging).","Consuming electrical energy from a battery is technically called charging.",0,"تسمى «التفريغ» (Discharging).","It is called discharging."],
["بطاريات السيارات العادية تعطي دفعة كهرباء قصيرة، أما بطاريات الدورة العميقة فتعطي قدرة مستمرة أقل لكنها ثابتة.","Regular car batteries give a short burst; deep cycle batteries give ongoing, lower yet consistent power.",1,"Batteries slide.","Batteries slide."],
["بطاريات الدورة العميقة صفائحها المعدنية أرق من البطاريات العادية.","Deep cycle batteries have thinner metal plates than regular batteries.",0,"العكس: Thicker metallic elements، وهذا يخليها تطلق الكهرباء بشكل أكثر ثباتًا.","The opposite: thicker plates, which release electricity more consistently."],
["بطاريات الدورة العميقة مصممة للشحن والتفريغ المتكرر حتى 80% من سعتها (من 100% إلى 20% SOC) بدون ضرر كبير.","Deep cycle batteries can be repeatedly discharged by up to 80% of capacity (100% to 20% SOC) without serious damage.",1,"Deep Cycle Batteries slide.","Deep cycle batteries slide."],
["عمق التفريغ (DoD) هو نسبة السعة المتبقية في البطارية.","Depth of Discharge (DoD) is the percentage of capacity still available in the battery.",0,"هذا تعريف State of Charge. الـ DoD هو النسبة اللي انفرغت من السعة الكلية.","That's State of Charge. DoD is the percentage that has been discharged."],
["كلما زاد عمق التفريغ (DoD)، قلّ عدد دورات حياة البطارية.","The higher the depth of discharge, the fewer cycles the battery lasts.",1,"من الرسم: حوالي 7000 دورة عند ~25% DoD، وحوالي 2000 دورة عند 80% DoD.","Graph: ~7000 cycles at ~25% DoD vs. ~2000 at 80%."],
["بطاريات الرصاص الحمضية (Lead-acid) هي الأكثر استخدامًا في الأنظمة الكهروضوئية السكنية.","Lead-acid batteries are most commonly used for residential PV applications.",1,"Lead-acid batteries are most commonly used for residential scale photovoltaic application.","Stated on the slide."],
["بطاريات الليثيوم أرخص من الرصاص الحمضية وعمر دوراتها أقصر.","Lithium-ion batteries are cheaper than lead-acid and have a shorter cycle life.",0,"العكس: الليثيوم كفاءته أعلى، وDoD أعمق، وعمر دوراته أطول، لكن تكلفته أعلى.","The opposite: Li-ion has higher efficiency, deeper DoD, longer cycle life, but higher cost."],
["بطاريات التدفق (Flow battery) مفيدة للتخزين الكبير، وأقل شيوعًا في الأنظمة الكهروضوئية الصغيرة.","Flow batteries are useful for large storage and less common in small PV systems.",1,"جدول أنواع البطاريات.","Battery types table."],
["جهد الدائرة المفتوحة للبطارية يسمى أيضًا الجهد النظري، وهو أقصى جهد ممكن عند أطرافها.","A battery's open circuit voltage is also called the theoretical voltage, the maximum possible at its terminals.",1,"Batteries Terminologies.","Battery terminologies."],
["جهد القطع (Cut-off voltage) هو الجهد اللي تحته لازم تنفصل البطارية عن الحمل لمنع التفريغ الزائد.","Cut-off voltage is the voltage below which the battery should be disconnected to prevent over-discharge.",1,"Cut-off voltage.","Cut-off voltage."],
["سعة البطارية تُقاس بوحدة الواط (W).","Battery capacity is measured in watts (W).",0,"تُقاس بالأمبير × ساعة (Ah).","It is measured in ampere-hours (Ah)."],
["بطاريتان 12 V و100 Ah على التوالي تعطي 24 V و100 Ah.","Two 12 V, 100 Ah batteries in series give 24 V and 100 Ah.",1,"التوالي يجمع الجهد والسعة تبقى نفسها.","Series adds voltage; capacity stays the same."],
["بطاريتان 12 V و100 Ah على التوازي تعطي 24 V و200 Ah.","Two 12 V, 100 Ah batteries in parallel give 24 V and 200 Ah.",0,"على التوازي: 12 V و200 Ah. الجهد ما يتغير.","In parallel: 12 V and 200 Ah; the voltage doesn't change."],
["الخلايا والألواح والمصفوفات الكهروضوئية تنتج تيارًا مستمرًا (DC).","PV cells, modules and arrays produce direct current (DC).",1,"Inverter slide.","Inverter slide."],
["معظم الأجهزة المنزلية مصممة للعمل على التيار المستمر (DC).","Most home appliances are designed to operate on direct current (DC).",0,"معظمها يعمل على AC، ولهذا نحتاج الإنفرتر.","Most run on AC, which is why an inverter is needed."],
["النظام المستقل (Stand-alone) يعمل بشكل مستقل عن الشبكة الكهربائية.","A stand-alone PV system operates independently from the utility grid.",1,"Stand-Alone Solar PV System.","Stand-alone solar PV system."],
["النظام المستقل يُستخدم غالبًا لما تكون الشبكة غير متوفرة أو غير موثوقة أو مكلفة التمديد.","A stand-alone system is mainly used when the grid is unavailable, unreliable or too expensive to extend.",1,"Stand-Alone Solar PV System.","Stand-alone solar PV system."],
["في النظام المستقل، الشبكة هي اللي تغذي الحمل في الليل.","In a stand-alone system, the grid supplies the load at night.",0,"في المستقل البطارية هي اللي تغذي الحمل في الليل. الشبكة للنظام المتصل.","In stand-alone, the battery supplies the load at night; the grid is for grid-connected."],
["تصميم النظام المستقل يعتمد على الحمل اليومي وزمن الاحتياط والإشعاع الشمسي المحلي.","Stand-alone sizing depends on daily load demand, backup time and local solar radiation.",1,"System sizing depends on daily load demand, backup time, and local solar radiation.","Stated on the slide."],
["النظام المقترن مباشرة (Direct-coupled) يوصل المصفوفة بالحمل مباشرة بدون بطاريات، مثل ضخ المياه.","A direct-coupled system connects the array directly to the load without batteries, e.g. water pumping.",1,"Direct-coupled system.","Direct-coupled system."],
["النظام الهجين المستقل يجمع الطاقة الشمسية مع مصدر آخر، ويمكن أن يقلل حجم البطاريات المطلوب.","A hybrid stand-alone system combines PV with another source and can reduce the required battery size.",1,"مثل مولد ديزل أو توربين رياح، ويحسّن الموثوقية.","E.g. a diesel generator or wind turbine; it improves reliability."],
["في النظام المتصل بالشبكة، لما يكون إنتاج الألواح أعلى من الحمل، يُصدَّر الفائض للشبكة.","In a grid-connected system, excess energy is exported to the grid when PV generation exceeds the load.",1,"Grid-Connected Solar PV System.","Grid-connected solar PV system."],
["الأنظمة المتصلة بالشبكة تحتاج دائمًا بطاريات.","Grid-connected systems always require batteries.",0,"In many grid-connected systems, batteries are not required.","In many grid-connected systems, batteries are not required."],

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function show(id){ ["setup","quiz","result","summary"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }
function item(q){
  const lec = LECTURES.find(l=>l.id===q.lec);
  const b = lec.bank[q.i], ar = lang==="ar";
  return {q: ar?b[0]:b[1], e: ar?b[3]:b[4], lecName: lec.short[lang]};
}
function availCount(){ return LECTURES.filter(l=>selectedLectures.has(l.id)).reduce((s,l)=>s+l.bank.length,0); }
function planned(){ return clampCount(countSel); }

function renderLecChips(){
  const c=$("lectures"); c.innerHTML="";
  const allBtn=document.createElement("button"); allBtn.className="chip";
  allBtn.textContent=T().selAll;
  allBtn.setAttribute("aria-pressed", selectedLectures.size===LECTURES.length);
  allBtn.onclick=()=>{ LECTURES.forEach(l=>selectedLectures.add(l.id)); renderLecChips(); updateAvail(); };
  c.appendChild(allBtn);
  LECTURES.forEach(l=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent=l.title[lang];
    const all = selectedLectures.size===LECTURES.length;
    b.setAttribute("aria-pressed", !all && selectedLectures.has(l.id));
    // from "All", a tap picks just that lecture; otherwise taps add/remove lectures
    b.onclick=()=>{
      if(all) selectedLectures=new Set([l.id]);
      else if(selectedLectures.has(l.id)) selectedLectures.delete(l.id);
      else selectedLectures.add(l.id);
      renderLecChips(); updateAvail();
    };
    c.appendChild(b);
  });
}
function updateAvail(){
  const n = selectedLectures.size;
  $("availNote").textContent = n===0 ? T().needLec : T().avail(availCount());
  $("startBtn").disabled = n===0;
  renderCounts(); updateNote();
}

function applyLang(){
  const html=document.documentElement;
  html.lang=lang; html.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = T().title;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent=T()[el.dataset.i]; });
  $("langSwitch").textContent=T().switchTo; $("langSwitch2").textContent=T().switchTo; $("langSwitch3").textContent=T().switchTo;
  document.querySelectorAll("#langs .chip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.lang===lang));
  renderLecChips(); updateAvail();
  if(!$("quiz").classList.contains("hidden")) render();
  if(!$("result").classList.contains("hidden")) renderResult();
  if(!$("summary").classList.contains("hidden")){ renderSumTabs(); renderSummary(); }
}

  const key=LECTURES.map(l=>l.id).filter(id=>selectedLectures.has(id)).join("+");
  const r=COUNT_RANGES[key]; if(!r) return [0,0];
  const avail=availCount(); return [Math.min(r[0],avail), Math.min(r[1],avail)];
}
function clampCount(n){ const [lo,hi]=countRange(); return Math.max(lo, Math.min(hi, Math.round(n)||lo)); }
function setCount(n){ countSel=clampCount(n); renderCounts(); updateNote(); }
function quickCounts(){
  const [lo,hi]=countRange(); if(!hi) return [];
  const v=[lo, Math.round((lo+(hi-lo)/3)/10)*10, Math.round((lo+2*(hi-lo)/3)/10)*10, hi];
  return v.filter((x,i)=>v.indexOf(x)===i);
}
function renderCounts(){
  const [lo,hi]=countRange(); if(hi) countSel=clampCount(countSel);
  const r=$("countRange"), inp=$("countInput");
  r.min=lo; r.max=hi; r.value=countSel; inp.min=lo; inp.max=hi; inp.value=countSel;
  r.disabled=inp.disabled=$("countMinus").disabled=$("countPlus").disabled = hi===0;
  $("countMin").textContent=lo; $("countMax").textContent=hi;
  const q=$("countQuick"); q.innerHTML="";
  quickCounts().forEach(n=>{
    const b=document.createElement("button"); b.className="chip"; b.type="button";
    b.textContent=n; b.setAttribute("aria-pressed", n===countSel);
    b.onclick=()=>setCount(n);
    q.appendChild(b);
  });
}
$("countRange").oninput=e=>setCount(+e.target.value);
$("countInput").oninput=e=>{ const v=+e.target.value, [lo,hi]=countRange(); if(v>=lo && v<=hi){ countSel=v; $("countRange").value=v; renderQuickState(); updateNote(); } };
$("countInput").onchange=e=>setCount(+e.target.value);
$("countMinus").onclick=()=>setCount(countSel-1);
$("countPlus").onclick=()=>setCount(countSel+1);
function renderQuickState(){ document.querySelectorAll("#countQuick .chip").forEach(b=>b.setAttribute("aria-pressed", +b.textContent===countSel)); }
$("langSwitch").onclick=$("langSwitch2").onclick=$("langSwitch3").onclick=()=>setLang(lang==="ar"?"en":"ar");
$("summaryBtn").onclick=()=>{ renderSumTabs(); renderSummary(); show("summary"); };
$("summaryBackBtn").onclick=()=>show("setup");

function buildPool(){
  let pool=[];
  LECTURES.forEach(l=>{ if(selectedLectures.has(l.id)){ for(let i=0;i<l.bank.length;i++) pool.push({lec:l.id, i}); } });
  return pool;
}

function start(){
  const pool = shuffle(buildPool());
  total = planned();
  qs = pool.slice(0,total).map(p=>{
    const b = LECTURES.find(l=>l.id===p.lec).bank[p.i];
    return {lec:p.lec, i:p.i, correct: b[2] ? 0 : 1};
  });
  answers=new Array(total).fill(null); idx=0; finished=false; timedOut=false; startedAt=Date.now();
  clearInterval(tick);
  const t=$("timer");
  if(mode==="exam"){
    timeLeft=total*SEC_PER_Q; t.classList.remove("hidden","low"); t.textContent=fmt(timeLeft);
    tick=setInterval(()=>{
      timeLeft--; t.textContent=fmt(Math.max(timeLeft,0)); t.classList.toggle("low", timeLeft<=60);
      if(timeLeft<=0){ timedOut=true; finish(); }
    },1000);
  } else t.classList.add("hidden");
  $("rail").classList.toggle("jump", mode==="exam");
  show("quiz"); render();
}

function renderRail(){
  const r=$("rail"); r.innerHTML="";
  qs.forEach((q,i)=>{
    const d=document.createElement("button"); d.className="dot"; d.setAttribute("aria-label",T().qn+(i+1));
    if(answers[i]!==null) d.classList.add(mode==="learn" ? (answers[i]===q.correct?"ok":"bad") : "ans");
    if(i===idx) d.classList.add("cur");
    if(mode==="exam") d.onclick=()=>{ idx=i; render(); }; else d.tabIndex=-1;
    r.appendChild(d);
  });
}

function render(){
  $("confirmBox").classList.add("hidden");
  const q=qs[idx], it=item(q), a=answers[idx], L=T().tf;
  $("pos").innerHTML=T().pos(idx+1,total);
  $("lecTag").textContent=it.lecName;
  $("qtext").textContent=it.q;
  renderRail();
  const box=$("opts"); box.innerHTML="";
  const locked = mode==="learn" && a!==null;
  L.forEach((o,i)=>{
    const b=document.createElement("button"); b.className="opt";
    const l=document.createElement("span"); l.className="l"; l.textContent=i===0?"✓":"✗";
    const t=document.createElement("span"); t.className="t"; t.textContent=o;
    b.append(l,t);
    if(locked){ b.disabled=true; if(i===q.correct) b.classList.add("ok"); else if(i===a) b.classList.add("bad"); }
    else if(a===i) b.classList.add("sel");
    b.onclick=()=>pick(i); box.appendChild(b);
  });
  const why=$("why");
  if(locked){
    const right=a===q.correct;
    why.className="why"+(right?"":" bad");
    why.innerHTML=""; const bb=document.createElement("b"); bb.textContent= right?T().right:T().wrong(q.correct);
    why.append(bb, document.createTextNode(it.e));
  } else why.className="why hidden";
  renderNav();
}

function renderNav(){
  const n=$("nav"); n.innerHTML=""; $("hint").textContent="";
  const last=idx===total-1;
  if(mode==="learn"){
    const b=document.createElement("button"); b.className="btn main";
    b.textContent= last?T().showRes:T().next; b.disabled=answers[idx]===null;
    b.onclick=()=> last?finish():(idx++,render()); n.appendChild(b);
    if(answers[idx]===null) $("hint").textContent=T().pickHint;
  } else {
    const p=document.createElement("button"); p.className="btn"; p.textContent=T().prev; p.disabled=idx===0;
    p.onclick=()=>{ idx--; render(); };
    const nx=document.createElement("button"); nx.className="btn main"; nx.textContent= last?T().end:T().nxt;
    nx.onclick=()=> last?confirmFinish():(idx++,render());
    n.append(p,nx);
    const left=answers.filter(x=>x===null).length;
    $("hint").textContent= left?T().left(left):T().allDone;
  }
}

function pick(i){
  if(finished) return;
  if(mode==="learn" && answers[idx]!==null) return;
  answers[idx]=i; render();
}
function confirmFinish(){
  const left=answers.filter(x=>x===null).length;
  if(!left){ finish(); return; }
  $("confirmMsg").textContent=T().confirm(left);
  $("confirmYes").textContent=T().yesEnd; $("confirmNo").textContent=T().keepGoing;
  $("confirmBox").classList.remove("hidden");
}
function finish(){
  if(finished) return;
  finished=true; clearInterval(tick);
  lastSecs=Math.round((Date.now()-startedAt)/1000);
  $("onlyWrong").setAttribute("aria-pressed","false");
  renderResult(); show("result");
}
function renderResult(){
  const correct=qs.filter((q,i)=>answers[i]===q.correct).length;
  const pct=Math.round(correct/total*100);
  $("bigScore").innerHTML=correct+' <span>/ '+total+'</span>';
  $("pct").textContent=T().pct(pct,fmt(lastSecs))+(timedOut?T().timeout:"");
  $("verdict").textContent=T().v[pct>=90?0:pct>=75?1:pct>=60?2:3];
  renderReview($("onlyWrong").getAttribute("aria-pressed")==="true");
}
function renderReview(onlyWrong){
  const r=$("review"); r.innerHTML="";
  qs.forEach((q,i)=>{
    const a=answers[i], ok=a===q.correct; if(onlyWrong && ok) return;
    const it=item(q), d=document.createElement("div"); d.className="rev"+(ok?"":" bad");
    const t=(cls,txt)=>{ const e=document.createElement("p"); e.className=cls; e.textContent=txt; d.appendChild(e); };
    t("rq",(i+1)+". ["+it.lecName+"] "+it.q);
    if(a===null) t("ra wrong",T().none); else if(!ok) t("ra wrong",T().yours+T().tf[a]);
    t("ra right",T().correct+T().tf[q.correct]);
    t("re",it.e);
    r.appendChild(d);
  });
  if(!r.children.length){ const p=document.createElement("p"); p.style.color="var(--muted)"; p.textContent=T().perfect; r.appendChild(p); }
}

$("onlyWrong").onclick=function(){ const on=this.getAttribute("aria-pressed")!=="true"; this.setAttribute("aria-pressed",on); renderReview(on); };
$("confirmYes").onclick=()=>{ $("confirmBox").classList.add("hidden"); finish(); };
$("confirmNo").onclick=()=>$("confirmBox").classList.add("hidden");
$("startBtn").onclick=start;
$("againBtn").onclick=()=>show("setup");
$("quitBtn").onclick=()=>{
  if(mode==="exam") confirmFinish();
  else if(answers.some(x=>x!==null)) finish();
  else { clearInterval(tick); show("setup"); }
};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="1"||k==="١"||k==="t") pick(0);
  else if(k==="2"||k==="٢"||k==="f") pick(1);
  else if(k==="enter"){
    const m=document.querySelector("#nav .btn.main");
    if(m && !m.disabled && document.activeElement.tagName!=="BUTTON") m.click();
  }
});

function renderSumTabs(){
  const c=$("sumTabs"); c.innerHTML="";
  LECTURES.forEach(l=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent=l.title[lang];
    b.setAttribute("aria-pressed", activeSumLec===l.id);
    b.onclick=()=>{ activeSumLec=l.id; renderSumTabs(); renderSummary(); };
    c.appendChild(b);
  });
}
function renderSummary(){
  const lec = LECTURES.find(l=>l.id===activeSumLec);
  const c=$("summaryContent"); c.innerHTML="";
  lec.summary[lang].forEach(sec=>{
    const d=document.createElement("div"); d.className="sec";
    const h=document.createElement("h3"); h.textContent=sec.h; d.appendChild(h);
    const list=document.createElement("ul");
    sec.items.forEach(t=>{ const li=document.createElement("li"); li.textContent=t; list.appendChild(li); });
    d.appendChild(list);
    c.appendChild(d);
  });
}

try{ const s=localStorage.getItem("me4245-lang"); if(s==="en"||s==="ar") lang=s; }catch(e){}
applyLang();
</script>
