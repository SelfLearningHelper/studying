<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ME4441 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem("me4441-theme")}catch(e){}
if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
if(t==="light")document.documentElement.dataset.theme="light";})();</script>
<style>
:root{
  /* dark tokens; [data-theme="light"] swaps them. The theme follows the device until the user picks one with the toggle */
  --bg:#111114; --surface:#1A1A1F; --ink:#F3F1EC; --muted:#A3A1A8; --line:#2E2D35;
  --primary:#FF7A45; --primary-soft:#3A2218; --on-primary:#16110E;
  --ok:#5BD08A; --ok-soft:#173022; --bad:#FF5A73; --bad-soft:#3B1820;
  --warn:#FFC24B; --warn-soft:#2D2412;
  --idle:#4A4952; --glow:rgba(255,122,69,.13);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F3F2EF; --surface:#FDFCFA; --ink:#17161A; --muted:#5C5A62; --line:#DEDBD5;
  --primary:#C2410C; --primary-soft:#FDE6D9; --on-primary:#FFF8F3;
  --ok:#1E7A45; --ok-soft:#DDF2E4; --bad:#C0263F; --bad-soft:#FBE0E4;
  --warn:#7A4F00; --warn-soft:#FFF0CC;
  --idle:#BDBAB4; --glow:rgba(194,65,12,.08);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  font-size:clamp(16px, 0.45vw + 14.5px, 19px); line-height:1.7;
  transition:background-color .25s, color .25s;
}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(900px 480px at 90% -8%, var(--glow), transparent 65%), radial-gradient(700px 420px at -5% 105%, var(--glow), transparent 60%)}
section:not(.hidden){animation:rise .4s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
button:active:not(:disabled){transform:scale(.98)}
.wrap{width:100%; max-width:760px; margin:0 auto; padding:clamp(20px,4vw,48px) clamp(14px,4vw,32px) 64px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--primary); outline-offset:2px}
.hidden{display:none !important}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

/* setup */
/* brand */
.brandbar{display:flex; margin:-6px 0 18px}
.brand{background:none; border:none; padding:6px 0; min-height:44px; font-weight:700; font-size:1.05rem; letter-spacing:-.2px; color:var(--ink)}
.brandDot{color:var(--primary)}
@media (hover:hover){ .brand:hover{color:var(--primary)} }
.intro h1{font-size:clamp(1.7rem, 3vw + 1rem, 2.5rem); line-height:1.25; margin:10px 0 6px; font-weight:700; letter-spacing:-.3px}
.intro p{margin:0; color:var(--muted); max-width:60ch}
.group{margin-top:30px}
.group h2{font-size:1rem; font-weight:600; margin:0 0 12px}
.modes{display:grid; grid-template-columns:1fr; gap:10px}
.mode{
  text-align:start; background:var(--surface); border:2px solid var(--line); border-radius:8px;
  padding:16px 16px 14px; transition:border-color .15s, background .15s;
}
.mode{display:flex; flex-direction:column; justify-content:flex-start}
.mode strong{display:block; font-size:1.02rem; margin-bottom:4px}
.mode span{color:var(--muted); font-size:.9rem; line-height:1.55; display:block}
.mode[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft)}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  min-width:64px; min-height:46px; padding:8px 16px; border-radius:8px; border:2px solid var(--line);
  background:var(--surface); font-weight:600; font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft); color:var(--primary)}
.chip.en{font-family:'Segoe UI', system-ui, sans-serif}
.note{color:var(--muted); font-size:.88rem; margin-top:10px}
.start{
  margin-top:34px; width:100%; min-height:54px; padding:14px; border:none; border-radius:8px;
  background:var(--primary); color:var(--on-primary); font-weight:700; font-size:1.08rem;
}
@media (hover:hover){ .start:hover{filter:brightness(1.07)} }
.start:disabled{opacity:.45; cursor:default}
.start.secondary{background:var(--surface); color:var(--ink); border:2px solid var(--line); margin-top:12px}

/* quiz */
.bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.pos{font-weight:600; font-variant-numeric:tabular-nums}
.pos small{color:var(--muted); font-weight:400}
.barside{display:flex; align-items:center; gap:8px}
.timer{font-variant-numeric:tabular-nums; font-weight:700; padding:4px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--line); direction:ltr}
.timer.low{color:var(--bad); border-color:var(--bad)}
.mini{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:4px 12px; font-size:.85rem; min-height:44px}
.quit{background:none; border:none; color:var(--muted); font-size:.9rem; text-decoration:underline; padding:6px; min-height:44px; min-width:44px}
.rail{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.dot{width:14px; height:14px; border-radius:50%; background:var(--idle); border:none; padding:0; transition:transform .15s, background .2s}
.dot.cur{outline:2px solid var(--ink); outline-offset:2px}
.dot.ans{background:var(--primary)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
@media (hover:hover){ .rail.jump .dot:hover{transform:scale(1.25)} }
.rail.jump{gap:0}
.rail.jump .dot{width:44px; height:44px; padding:15px; background-clip:content-box}
.rail.jump .dot.cur{outline-offset:-11px}
.card{background:var(--surface); border-radius:8px; padding:clamp(18px,3vw,32px) clamp(15px,3vw,30px); border:1px solid var(--line)}
.lecTag{display:inline-block; background:var(--primary-soft); color:var(--primary); font-size:.78rem; font-weight:600; padding:3px 12px; border-radius:8px; margin-bottom:12px}
.qtext{font-size:1.18rem; font-weight:600; line-height:1.65; margin:0 0 18px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{
  display:flex; align-items:flex-start; gap:12px; text-align:start; width:100%; min-height:52px;
  background:var(--bg); border:2px solid transparent; border-radius:8px; padding:12px 14px;
  transition:border-color .12s, background .12s;
}
@media (hover:hover){ .opt:hover:not(:disabled){border-color:var(--line)} }
.opt .l{
  flex:none; width:28px; height:28px; border-radius:6px; display:grid; place-items:center;
  background:var(--surface); border:1.5px solid var(--line); font-weight:700; font-size:.9rem; margin-top:1px;
}
.opt .t{flex:1; min-width:0; overflow-wrap:anywhere}
.opt.sel{border-color:var(--primary); background:var(--primary-soft)}
.opt.sel .l{background:var(--primary); color:var(--on-primary); border-color:var(--primary)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.ok .l{background:var(--ok); color:var(--on-primary); border-color:var(--ok)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.bad .l{background:var(--bad); color:var(--on-primary); border-color:var(--bad)}
.opt:disabled{cursor:default; color:inherit}
.why{margin-top:16px; padding:14px 16px; border-radius:8px; border-inline-start:4px solid var(--ok); background:var(--ok-soft); font-size:.97rem}
.why.bad{border-inline-start-color:var(--bad); background:var(--bad-soft)}
.why b{display:block; margin-bottom:2px}
.nav{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; min-height:52px; padding:12px; border-radius:8px; border:2px solid var(--line); background:var(--surface); font-weight:600}
.btn.main{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.btn:disabled{opacity:.45; cursor:default}
.hint{color:var(--muted); font-size:.85rem; margin-top:10px; text-align:center}

/* result */
.score{text-align:center; padding:26px 0 10px}
.score .big{font-size:clamp(3.4rem, 6vw + 1.5rem, 5rem); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; direction:ltr}
.score .big span{font-size:.42em; color:var(--muted); font-weight:500}
.score p{margin:10px 0 0; color:var(--muted)}
.verdict{font-size:1.15rem; font-weight:600; color:var(--ink) !important; margin-top:14px !important}
.tools{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px; gap:10px; flex-wrap:wrap}
.tools h2{margin:0; font-size:1.1rem}
.toggle{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 14px; font-size:.9rem; min-height:44px}
.toggle[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.review{display:grid; grid-template-columns:1fr; gap:10px}
.rev{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px; border-inline-start:5px solid var(--ok)}
.rev.bad{border-inline-start-color:var(--bad)}
.rev .rq{font-weight:600; margin:0 0 8px}
.rev .ra{font-size:.93rem; margin:2px 0}
.rev .ra.wrong{color:var(--bad)}
.rev .ra.right{color:var(--ok)}
.rev .re{font-size:.9rem; color:var(--muted); margin-top:8px}
.again{margin-top:22px}

/* summary */
.sec{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:12px}
.sec h3{margin:0 0 10px; font-size:1.05rem; color:var(--primary)}
.sec ul, .sec ol{margin:0; padding-inline-start:22px; display:flex; flex-direction:column; gap:6px; font-size:.97rem; line-height:1.6}

/* phones */
@media (max-width:560px){
  .modes{grid-template-columns:1fr}
  .qtext{font-size:1.08rem}
  #langs .chip, #counts .chip{flex:1 1 0; min-width:0; padding:8px 0}
}
/* tablets landscape & laptops */
@media (min-width:1024px){
  .wrap{max-width:880px}
  .setup-grid{display:grid; grid-template-columns:1fr 1.15fr; gap:48px; align-items:start; min-height:70vh; align-content:center}
  .setup-grid .intro{position:sticky; top:48px}
  .setup-grid .group:first-child{margin-top:0}
  .review{grid-template-columns:1fr 1fr; align-items:start}
}
@media (min-width:1024px) and (min-height:700px){
  #quiz .card{min-height:420px}
}
/* feedback motion */
@keyframes pop{0%{transform:scale(1)} 40%{transform:scale(1.035)} 100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}}
.opt.pop{animation:pop .38s cubic-bezier(.16,1,.3,1)}
.opt.shake{animation:shake .38s ease-in-out}
.streak{font-weight:700; padding:4px 10px; border-radius:8px; background:var(--primary-soft); color:var(--primary); font-variant-numeric:tabular-nums; direction:ltr}
.streak.bump{animation:pop .3s cubic-bezier(.16,1,.3,1)}
.best{color:var(--primary) !important; font-weight:600}
#quiz .card{transition:transform .25s ease-out}
.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}

/* flashcards */
.fcTop{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.fcProg{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:20px}
.fcProg i{display:block; height:100%; width:0; background:var(--primary); transition:width .35s cubic-bezier(.16,1,.3,1)}
.flipWrap{perspective:1400px}
.flip{display:grid; width:100%; padding:0; border:none; background:none; text-align:start; transition:transform .55s cubic-bezier(.16,1,.3,1); transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:clamp(20px,4vw,34px); min-height:300px; display:flex; flex-direction:column}
.face.back{transform:rotateY(180deg); border-color:var(--primary)}
.face .fq{font-size:1.2rem; font-weight:600; line-height:1.65; margin:6px 0 0}
.face .tap{margin-top:auto; padding-top:18px; color:var(--muted); font-size:.85rem; text-align:center}
.face .ans{font-size:1.15rem; font-weight:700; color:var(--primary); margin:6px 0 14px; line-height:1.6}
.face .exp{color:var(--muted); font-size:.95rem; line-height:1.65}
.fcBtns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.fcBtns .btn.no{border-color:var(--bad); color:var(--bad)}
.fcBtns .btn.yes{border-color:var(--ok); color:var(--ok)}
.fcDone{text-align:center; padding:40px 0 10px}
.fcDone .big{font-size:3rem; line-height:1}
.fcDone h2{margin:14px 0 6px}
.fcDone p{color:var(--muted); margin:0}

/* topic from summary */
.topicBtn{display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:var(--surface); border:1.5px dashed var(--primary); color:var(--primary);
  border-radius:8px; padding:8px 14px; min-height:44px; font-weight:600; font-size:.92rem}
@media (hover:hover){ .topicBtn:hover{background:var(--primary-soft)} }
.topicPanel{margin-top:12px; padding:14px 16px; border-radius:8px; background:var(--surface); border:1px solid var(--line); color:var(--ink); animation:rise .3s cubic-bezier(.16,1,.3,1)}
.topicPanel h4{margin:8px 0 10px; font-size:1.02rem; color:var(--primary); line-height:1.5}
.topicPanel > ul, .topicPanel > ol{margin:0 0 14px; padding-inline-start:22px; display:flex; flex-direction:column; gap:7px; font-size:.95rem; line-height:1.65}
.topicPanel .searchWrap{border-top:1px solid var(--line); padding-top:12px}
.topicPanel .searchWrap h5{margin:0 0 8px; font-size:.9rem}
.topicPanel .sRes{background:var(--bg)}

/* summary search */
.search{position:relative; margin:4px 0 14px}
.search input{width:100%; min-height:48px; padding:10px 14px; border:2px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; font-size:1rem}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none; border-color:var(--primary)}
.sCount{color:var(--muted); font-size:.85rem; margin:0 0 10px}
.sRes{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px}
.sRes h4{margin:6px 0 8px; font-size:1rem; color:var(--primary); line-height:1.5}
.sRes ul{margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:6px; font-size:.95rem; line-height:1.6}
mark{background:var(--warn-soft); color:var(--warn); border-radius:3px; padding:0 2px}

/* Arabic translation under an English explanation */
.tr{margin:8px 0 0; padding-inline-start:10px; border-inline-start:2px solid currentColor; opacity:.85; font-size:.95em}

/* lecture picker */
.grouphead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px}
.grouphead h2{margin:0 !important}
.linkBtn{background:none; border:none; color:var(--primary); font-weight:600; font-size:.9rem; padding:8px 4px; min-height:44px; text-decoration:underline; text-underline-offset:4px}
.lecList{display:grid; grid-template-columns:1fr; gap:8px}
.lec{display:flex; align-items:center; gap:12px; width:100%; text-align:start; min-height:52px; padding:10px 14px;
  border:2px solid var(--line); border-radius:8px; background:var(--surface); font-weight:600; transition:border-color .15s, background .15s}
.lec .box{flex:none; width:22px; height:22px; border:2px solid var(--line); border-radius:5px; display:grid; place-items:center; font-size:.8rem; line-height:1; color:transparent}
.lec[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft)}
.lec[aria-pressed="true"] .box{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
@media (hover:hover){ .lec:hover{border-color:var(--primary)} }

/* footer + about */
.disclaimer{margin-top:16px !important; font-size:.88rem; font-weight:600; color:var(--warn) !important; background:var(--warn-soft); border-inline-start:3px solid var(--warn); border-radius:6px; padding:8px 12px}
.foot{margin-top:48px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap}
.aboutBtn{background:none; border:1px solid var(--line); border-radius:8px; padding:6px 18px; min-height:44px; color:var(--muted); font-size:.9rem}
@media (hover:hover){ .aboutBtn:hover{color:var(--ink); border-color:var(--ink)} }
#about{border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); padding:24px 22px 18px; width:min(92vw,420px)}
#about::backdrop{background:rgba(10,10,12,.6)}
#about h2{margin:0 0 2px; font-size:1.2rem}
#about p{margin:0 0 4px; color:var(--muted); font-size:.95rem}
#about .links{display:flex; flex-direction:column; gap:6px; margin:14px 0 18px}
#about a{color:var(--primary); font-weight:600; overflow-wrap:anywhere}
#welcome{border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); padding:28px 24px 22px; width:min(92vw,440px)}
#welcome::backdrop{background:rgba(10,10,12,.7)}
#welcome h2{margin:0 0 10px; font-size:1.35rem; line-height:1.4}
#welcome h2::before{content:""; display:block; width:36px; height:4px; background:var(--primary); border-radius:2px; margin-bottom:14px}
#welcome p{margin:0 0 20px; color:var(--muted)}
#welcome .before{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:0 0 20px}
#welcome .before b{display:block; margin-bottom:6px; font-size:.95rem}
#welcome .before ul{margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:6px; font-size:.9rem; line-height:1.6; color:var(--ink)}
#welcome .go{width:100%; min-height:50px; border:none; border-radius:8px; background:var(--primary); color:var(--on-primary); font-weight:700; font-size:1.05rem}
#about .aboutWhy{margin:10px 0 0; color:var(--ink); font-size:.93rem}
#about .close{width:100%; min-height:44px; border-radius:8px; border:2px solid var(--line); background:var(--bg); font-weight:600}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} button:active:not(:disabled){transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="brandbar"><button class="brand" id="brandBtn" aria-haspopup="dialog"><span data-i="brand"></span><span class="brandDot">.</span></button></header>

  <section id="setup">
    <div class="setup-grid">
      <div class="intro">
        <h1 data-i="title"></h1>
        <p data-i="sub"></p>
        <p class="disclaimer" data-i="disclaimer"></p>
      </div>
      <div>
        <div class="group">
          <h2 data-i="langH"></h2>
          <div class="chips" id="langs">
            <button class="chip" data-lang="ar" aria-pressed="true">العربية</button>
            <button class="chip en" data-lang="en" aria-pressed="false">English</button>
          </div>
        </div>
        <div class="group">
          <div class="grouphead">
            <h2 data-i="lecH"></h2>
            <button class="linkBtn" id="allLec"></button>
          </div>
          <div class="lecList" id="lectures"></div>
          <p class="note" id="availNote"></p>
        </div>
        <div class="group">
          <h2 data-i="modeH"></h2>
          <div class="modes">
            <button class="mode" data-mode="learn" aria-pressed="true"><strong data-i="m1"></strong><span data-i="m1d"></span></button>
            <button class="mode" data-mode="exam" aria-pressed="false"><strong data-i="m2"></strong><span data-i="m2d"></span></button>
            <button class="mode" data-mode="cards" aria-pressed="false"><strong data-i="m3"></strong><span data-i="m3d"></span></button>
          </div>
        </div>
        <div class="group">
          <h2 data-i="countH"></h2>
          <div class="chips" id="counts"></div>
          <p class="note hidden" id="countForced"></p>
          <p class="note" id="timeNote"></p>
        </div>
        <button class="start" id="startBtn" data-i="start"></button>
        <button class="start secondary" id="summaryBtn" data-i="summaryBtn"></button>
      </div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="bar">
      <div class="pos" id="pos"></div>
      <div class="barside">
        <div class="streak hidden" id="streak"></div>
        <div class="timer hidden" id="timer" role="timer"></div>
        <div class="sr-only" id="timerLive" aria-live="polite"></div>
        <button class="mini" id="langSwitch"></button>
        <button class="quit" id="quitBtn" data-i="quit"></button>
      </div>

const SUM_AR = [
{h:"01 — التعريف", items:[
"إدارة الهندسة: تطبيق مبادئ الإدارة وأساليب اتخاذ القرار على الأنشطة والمنظمات الهندسية لتحقيق أهداف محددة بفعالية وكفاءة.",
"المهندس يحل مشاكل تقنية؛ مدير الهندسة يقرر أي حل يخدم المنظمة. السؤال الحقيقي: أي حل نختار ولماذا؟ وليس فقط هل نقدر نصممه؟"
]},
{h:"02 — مجالات المعرفة الثلاثة", items:[
"المعرفة الهندسية: الأنظمة التقنية، العمليات، المنتجات، التقنيات، المشاكل الهندسية.",
"المعرفة الإدارية: تنسيق الناس، الأنشطة، الموارد، وأداء المنظمة.",
"معرفة اتخاذ القرار: المشاكل، البدائل، القيود، النتائج، مسارات العمل.",
"إدارة الهندسة تعمل عند نقطة التقاء التقنية بالإدارة."
]},
{h:"03 — المهندس مقابل مدير الهندسة", items:[
"الفرق أساسًا في نطاق المسؤولية والصلاحية والمساءلة، وليس فرقًا مطلقًا.",
"المهندس: يحلل ويصمم ويختبر، ومسؤول غالبًا عن مخرجاته التقنية الشخصية.",
"مدير الهندسة: يدمج التقني بالتنظيمي، ويوازن الأداء مع التكلفة والوقت والجودة والمخاطرة، ومسؤول عن نتائج الفريق أو المشروع أو المنظمة.",
"تحوّل السؤال: من «كيف أديت أنا؟» إلى «كيف أدى الفريق أو المشروع أو المنظمة؟»."
]},
{h:"04 — لماذا نحتاج إدارة الهندسة (حالة اختيار الماكينة)", items:[
"الماكينتان A وB مقبولتان تقنيًا لكن تختلفان في السعر والطاقة الإنتاجية ووقت التسليم والصيانة والموثوقية.",
"الحل الأكثر تقدمًا تقنيًا ليس تلقائيًا أفضل حل إداري.",
"أسئلة الإدارة: ما الطاقة المطلوبة فعلًا؟ ما الميزانية المتاحة؟ ما مدى الإلحاح؟ هل تقدر المنظمة تصون الماكينة؟ ما تكاليف التشغيل والصيانة والتوقف والمخاطر وتكلفة دورة الحياة؟"
]},
{h:"05 — منظور دورة الحياة", items:[
"الشراء (استثمار رأسمالي) ← التشغيل (طاقة وعمالة ومواد) ← الصيانة (مخططة وغير مخططة) ← التوقف (إنتاج مفقود) ← العمر الإنتاجي (استبدال وتخلص).",
"حالة مشكلة الجودة (ارتفاع نسبة الرفض من 2% إلى 8%): منظور المهندس تقني بحت (معاملات القطع، تآكل الأداة، دقة القياس...)، بينما مدير الهندسة يضيف الأثر المالي والإلحاح واستمرار الإنتاج وتخصيص الفنيين وتأثير العملاء واستدامة الحل."
]},
{h:"06 — المنظمة كنظام", items:[
"مدخلات: أشخاص، مواد، معدات، مال، معلومات، تقنية، طاقة، وقت.",
"عمليات: تصميم، تصنيع، إنشاء، صيانة، شراء، جودة، مشاريع، بحث وتطوير.",
"مخرجات: منتجات، مشاريع، تصاميم، خدمات، بنية تحتية، حلول، قيمة للعميل، نتائج مالية.",
"التسلسل: مدخلات ← عمليات ← مخرجات ← تغذية راجعة على الأداء. وقرار في جزء من المنظمة قد يخلق عواقب في جزء آخر."
]},
{h:"07 — الأداء المحلي مقابل أداء النظام", items:[
"مثال: شراء مكوّن أرخص (تحسين محلي) قد يرفع أعطال المعدات وساعات الصيانة والتوقف ومطالبات الضمان وشكاوى العملاء.",
"التحسين المحلي ذو قيمة فقط إذا دعم أهداف النظام ككل، ومؤشرات الأداء المحلية يجب أن تتماشى مع أهداف المنظمة."
]},
{h:"08 — تصنيف الموارد", items:[
"الأشخاص: مهندسون، فنيون، مشغلون، مشرفون، مدراء، مختصون.",
"المعدات: ماكينات، خطوط إنتاج، أدوات، مركبات، مختبرات، حواسيب.",
"المواد: مواد خام، مكونات، قطع غيار، مستهلكات، إمدادات.",
"المال: استثمار رأسمالي، رواتب، ميزانيات، صيانة، تمويل تشغيلي.",
"الأساليب (Methods): عمليات وإجراءات ومعايير وتعليمات عمل.",
"المعلومات: مخططات، مواصفات، جداول، بيانات، سجلات، متطلبات."
]},
{h:"09 — الندرة وتخصيص الموارد", items:[
"مثال: 10 مهندسين متاحين مقابل 15 مطلوبين (مشاريع A=6، B=5، C=4).",
"الندرة تفرض الحاجة للاختيار الإداري، لأنه ليس كل نشاط مرغوب يحصل على كل ما يطلبه من موارد.",
"تخصيص الموارد: عملية تحديد كيفية توزيع الموارد المحدودة بين متطلبات متنافسة.",
"عوامل التخصيص: المواعيد والإلحاح، السلامة والالتزامات التعاقدية، أهمية العميل والربحية، الأهمية الاستراتيجية والتعقيد، المهارات والتوقيت وتوفر الأفراد، الترابط بين الأنشطة."
]},
{h:"10 — الأهداف مقابل القيود", items:[
"الهدف: ما الذي نحاول تحقيقه؟ (تقليل التكلفة، الإنجاز في الوقت، زيادة الإنتاج، تقليل العيوب، تحسين الجودة، تقليل التوقف، تحسين السلامة، زيادة الربحية).",
"القيد: تحديد أو متطلب يقيّد البدائل المتاحة (الميزانية المعتمدة، الموعد النهائي، الموظفون المتاحون، طاقة الماكينة، توفر المواد، المواصفات التقنية، متطلبات السلامة، الأنظمة، المتطلبات التعاقدية).",
"بعض القيود — السلامة والقانون والعقود — تعمل كشروط جدوى غير قابلة للتفاوض.",
"نفس العامل (مثل التكلفة) قد يكون هدفًا في قرار وقيدًا في قرار آخر، حسب صياغة مشكلة القرار."
]},
{h:"11 — المقايضات (Trade-offs)", items:[
"تحدث المقايضة عندما يتطلب تحسين معيار قبول أداء أقل أو تكلفة/مخاطرة أعلى في مكان آخر.",
"أزواج شائعة: التكلفة↔الجودة، التكلفة↔الموثوقية، الوقت↔التكلفة، الأداء↔التكلفة، المخزون↔التوفر، المرونة↔التوحيد القياسي.",
"المقايضات معتمدة على السياق وليست قواعد عامة؛ فمثلًا تقليل العيوب قد يحسّن الجودة ويقلل إعادة العمل والتكلفة ووقت التسليم في نفس الوقت.",
"حالة مدة المشروع: تسريع من 8 إلى 6 أشهر عبر موظفين إضافيين أو عمل إضافي أو ورديات أو نقل/موردين أسرع، لكن هذا يحمل مخاطر تنسيق وجودة وسلامة وتنفيذ وتكلفة أعلى.",
"حالة اختيار المورد: لا يوجد «أفضل» مطلق؛ الاختيار يعتمد على الهدف والقيود ومعايير القرار المتاحة."
]},
{h:"12 — الفعالية والكفاءة والإنتاجية", items:[
"الفعالية (Effectiveness): «عمل الأشياء الصحيحة» — مدى تحقيق الأهداف المطلوبة.",
"الكفاءة (Efficiency): «عمل الأشياء بالطريقة الصحيحة» — مدى الاقتصاد في استخدام الموارد.",
"الإنتاجية (Productivity): المخرجات ÷ المدخلات.",
"مثال تحذيري: فريق A (10 مهندسين، 20 حزمة) = 2 حزمة/مهندس؛ فريق B (8 مهندسين، 24 حزمة) = 3 حزم/مهندس. إنتاجية أعلى لا تعني بالضرورة أداءً تنظيميًا أفضل — يجب مراعاة التعقيد والجودة وساعات العمل وإعادة العمل والسلامة ورضا العميل."
]},
{h:"13 — عملية اتخاذ القرار", ordered:true, items:[
"تعريف المشكلة",
"تحديد الهدف",
"تحديد القيود ذات الصلة",
"تطوير بدائل ممكنة",
"وضع معايير القرار المناسبة",
"جمع وتحليل المعلومات ذات الصلة",
"تقييم البدائل",
"اختيار وتنفيذ البديل المناسب",
"متابعة النتائج ← تغذية راجعة للخطوة الأولى (العملية دورة وليست خطًا مستقيمًا)"
]},
{h:"14 — عرّف المشكلة قبل الحل", items:[
"المشكلة المُبلَّغة: «إنتاجنا منخفض، نحتاج ماكينة أخرى».",
"الحقيقة المكتشفة: الماكينات الحالية تعمل بـ65% استغلال فقط بسبب نقص المواد وتأخيرات الإعداد والانتظار بين العمليات.",
"الحل التقني المتطور لمشكلة خاطئة يبقى قرارًا إداريًا سيئًا."
]},
{h:"15 — المخاطرة وعدم اليقين", items:[
"التعريف الكلاسيكي: المخاطرة = يمكن تقدير احتمالات النتائج؛ عدم اليقين = لا يمكن تقدير النتائج و/أو الاحتمالات بشكل موثوق.",
"الأطر الحديثة: المخاطرة = أثر عدم اليقين على أهداف المنظمة.",
"مثال شراء خط إنتاج آلي: أهم أوجه عدم اليقين هي الطلب المستقبلي الفعلي، وموثوقية المعدات، وأسعار الطاقة، ومتطلبات الصيانة، وتوفر الفنيين المهرة، وظهور تقنية منافسة."
]},
{h:"16 — الحالة المتكاملة النهائية", items:[
"شركة تنتج 1,200 وحدة/يوم، وارتفع الطلب إلى نحو 1,500. يُقترح شراء ماكينة آلية بـ1.8 مليون ريال.",
"معلومات إضافية: استغلال المعدات ≈70%، معدل عيوب 6%، العمل الإضافي مرتفع أصلًا، اختناق في مرحلة إنتاج واحدة، الماكينة تحتاج صيانة متخصصة، التسليم 7 أشهر، الطلب المستقبلي غير مؤكد.",
"الدرس: لا تُتخذ الموافقة الفورية — يجب أولًا فهم المشكلة الحقيقية والأهداف والقيود والمعلومات الناقصة؛ فمعالجة الاختناق وخفض العيوب قد يرفعان الإنتاج بدون ماكينة جديدة."
]},
{h:"17 — ملخص الوحدة الأولى", ordered:true, items:[
"التكامل: إدارة الهندسة تدمج التفكير التقني والتنظيمي.",
"الجدوى ≠ الأفضل: الجدوى التقنية وحدها لا تحدد أفضل حل تنظيمي.",
"أدوار متداخلة: الفروقات أساسًا في النطاق والصلاحية والمسؤولية والمساءلة.",
"منظور الأنظمة: المنظمات الهندسية تعمل كأنظمة (مدخلات، عمليات، مخرجات، تغذية راجعة).",
"موارد محدودة: الندرة تخلق الحاجة للأولوية وتخصيص الموارد.",
"الأهداف والقيود: تُعرّف مشكلة القرار وتقيّد البدائل الممكنة.",
"مقايضات معتمدة على السياق: التحسينات أحيانًا تخدم عدة معايير معًا.",
"أبعاد الأداء: الفعالية والكفاءة والإنتاجية أبعاد مختلفة للأداء.",
"اتخاذ قرار سليم: يبدأ بتعريف صحيح للمشكلة.",
"المخاطرة وعدم اليقين: القرارات الهندسية غالبًا تُتخذ بدون معرفة كاملة بالمستقبل."
]},
{h:"18 — الفكرة الرئيسية: فكّر كمدير هندسة", items:[

const T = () => UI[lang];

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function show(id){ ["setup","quiz","result","summary","cards"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }
function item(q){
  const lec = LECTURES.find(l=>l.id===q.lec);
  const bank = lec.bank[lang];
  const b = bank[q.i];
  const base=[b[1],...b[2]];
  return {q:b[0], opts:q.perm.map(k=>base[k]), e:b[3], tr:expAr(q.lec,q.i), lecName:lec.title[lang]};
}

function renderLecChips(){
  const c=$("lectures"); c.innerHTML="";
  const all = selectedLectures.size===LECTURES.length;
  const allBtn=$("allLec");
  allBtn.textContent = all ? T().deselAll : T().selAll;
  allBtn.onclick=()=>{
    if(selectedLectures.size===LECTURES.length) selectedLectures.clear();
    else LECTURES.forEach(l=>selectedLectures.add(l.id));
    renderLecChips(); updateAvail();
  };
  LECTURES.forEach(l=>{
    const b=document.createElement("button"); b.className="lec";
    const box=document.createElement("span"); box.className="box"; box.setAttribute("aria-hidden","true"); box.textContent="✓";
    const t=document.createElement("span"); t.textContent=l.title[lang];
    b.append(box,t);
    b.setAttribute("aria-pressed", selectedLectures.has(l.id));
    b.onclick=()=>{
      if(selectedLectures.has(l.id)) selectedLectures.delete(l.id); else selectedLectures.add(l.id);
      renderLecChips(); updateAvail();
    };
    c.appendChild(b);
  });
}
/* ---- question count: options depend on how many questions the selection has ----
   N < 10: no choice, the quiz uses all N. N <= 30: 10, 20, All. N <= 100: 10, 20, 30, 50, All.
   N > 100: 20, 40, 80, 120, 200 (All only replaces values that reach N). */
let countSel=null;
function availN(){ return mode==="cards" ? cardPool().length : buildPool().length; }
function countOptions(N){
  if(N<10) return [];
  const ladder = N<=30 ? [10,20] : N<=100 ? [10,20,30,50] : [20,40,80,120,200];
  const opts = ladder.filter(x=>x<N);
  if(N<=100 || ladder.some(x=>x>=N)) opts.push(N);
  return opts;
}
function planned(){ const N=availN(); return N<10 ? N : Math.min(countSel||0, N); }
function renderCounts(){
  const N=availN(), opts=countOptions(N), box=$("counts"), forced=$("countForced");
  box.innerHTML="";
  box.classList.toggle("hidden", opts.length===0);
  forced.classList.toggle("hidden", !(N>0 && N<10));
  if(N>0 && N<10) forced.textContent=T().forced(N);
  if(opts.length){
    if(!opts.includes(countSel)){
      // first render picks the middle option; later, snap to the nearest one that still exists
      countSel = countSel===null ? opts[Math.floor((opts.length-1)/2)] : opts.reduce((a,b)=>Math.abs(b-countSel)<Math.abs(a-countSel)?b:a);
    }
    opts.forEach(n=>{
      const b=document.createElement("button"); b.className="chip"; b.type="button";
      b.textContent = n===N ? T().allN(N) : n;
      b.setAttribute("aria-pressed", n===countSel);
      b.onclick=()=>{ countSel=n; renderCounts(); };
      box.appendChild(b);
    });
  }
  updateNote();
}
function updateAvail(){
  const n = selectedLectures.size;
  if(n===0){ $("availNote").textContent = T().needLec; }
  else {
    const total = mode==="cards" ? cardPool().length : LECTURES.filter(l=>selectedLectures.has(l.id)).reduce((s,l)=>s+l.bank.ar.length,0);
    $("availNote").textContent = T().avail(total);
  }
  $("startBtn").disabled = n===0;
  renderCounts();
}

function applyLang(){
  const html=document.documentElement;
  html.lang=lang; html.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = T().title;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent=T()[el.dataset.i]; });
  updateThemeBtn();
  $("langSwitch4").textContent=T().switchTo;
  $("sumSearch").placeholder=T().searchPh;
  if($("sumSearch").value) runSumSearch();
  if(!$("cards").classList.contains("hidden")) renderCard();
  $("langSwitch").textContent=T().switchTo; $("langSwitch2").textContent=T().switchTo; $("langSwitch3").textContent=T().switchTo;
  document.querySelectorAll("#langs .chip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.lang===lang));
  renderLecChips(); updateAvail();
  updateNote();
  if(!$("quiz").classList.contains("hidden")) render();
  if(!$("result").classList.contains("hidden")) renderResult();
  if(!$("summary").classList.contains("hidden")){ renderSumTabs(); renderSummary(); }
}
function updateNote(){
  $("timeNote").textContent = mode==="exam" ? T().noteExam(planned()*SEC_PER_Q/60) : mode==="cards" ? T().noteCards : T().noteLearn;
  $("startBtn").textContent = mode==="cards" ? T().startCards : T().start;
}
function setLang(l){ lang=l; try{localStorage.setItem("me4441-lang",l)}catch(e){} applyLang(); }

document.querySelectorAll("#langs .chip").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; document.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed", x===b)); updateNote(); updateAvail();
});
$("langSwitch").onclick=$("langSwitch2").onclick=$("langSwitch3").onclick=()=>setLang(lang==="ar"?"en":"ar");
$("summaryBtn").onclick=()=>{ renderSumTabs(); renderSummary(); show("summary"); };
$("summaryBackBtn").onclick=()=>show("setup");

function buildPool(){
  let pool=[];
  LECTURES.forEach(l=>{ if(selectedLectures.has(l.id)){ for(let i=0;i<l.bank.ar.length;i++) pool.push({lec:l.id, i}); } });
  return pool;
}

function start(){
  const pool = shuffle(buildPool());
  const n = Math.min(planned(), pool.length);
  qs = pool.slice(0,n).map(p=>{
    const perm=shuffle([0,1,2,3]);
    return {lec:p.lec, i:p.i, perm, correct:perm.indexOf(0)};
  });
  count = n;
  answers=new Array(count).fill(null); idx=0; finished=false; streak=0; bestStreak=0; justPicked=false; timedOut=false; startedAt=Date.now();
  clearInterval(tick);
  const t=$("timer");
  if(mode==="exam"){
    timeLeft=count*SEC_PER_Q; t.classList.remove("hidden","low"); t.textContent=fmt(timeLeft); $("timerLive").textContent="";
    tick=setInterval(()=>{
      timeLeft--; t.textContent=fmt(Math.max(timeLeft,0)); t.classList.toggle("low", timeLeft<=60);
      if(timeLeft===60) $("timerLive").textContent=T().timeLow;
      if(timeLeft<=0){ timedOut=true; finish(); }
    },1000);
  } else t.classList.add("hidden");
  $("rail").classList.toggle("jump", mode==="exam");
  show("quiz"); render();
}

function renderRail(){
  const r=$("rail"); r.innerHTML="";
  qs.forEach((q,i)=>{
    const d=document.createElement("button"); d.className="dot"; d.setAttribute("aria-label",T().qn+(i+1));
    if(answers[i]!==null) d.classList.add(mode==="learn" ? (answers[i]===q.correct?"ok":"bad") : "ans");
    if(i===idx) d.classList.add("cur");
    if(mode==="exam") d.onclick=()=>{ idx=i; render(); }; else d.tabIndex=-1;
    r.appendChild(d);
  });
}

function render(){
  const q=qs[idx], it=item(q), a=answers[idx], L=T().letters;
  $("pos").innerHTML=T().pos(idx+1,count);
  $("lecTag").textContent=it.lecName;
  $("qtext").textContent=it.q;
  renderRail();
  const box=$("opts"); box.innerHTML="";
  const locked = mode==="learn" && a!==null;
  it.opts.forEach((o,i)=>{
    const b=document.createElement("button"); b.className="opt";
    const l=document.createElement("span"); l.className="l"; l.textContent=L[i];
    const t=document.createElement("span"); t.className="t"; t.textContent=o;
    b.append(l,t);
    if(locked){
      b.disabled=true;
      if(i===q.correct){ b.classList.add("ok"); if(justPicked && a===i) b.classList.add("pop"); }
      else if(i===a){ b.classList.add("bad"); if(justPicked) b.classList.add("shake"); }
    }
    else if(a===i) b.classList.add("sel");
    b.onclick=()=>pick(i); box.appendChild(b);
  });
  const why=$("why");
  if(locked){
    const right=a===q.correct;
    why.className="why"+(right?"":" bad");
    why.innerHTML=""; const bb=document.createElement("b"); bb.textContent= right?T().right:T().wrong(L[q.correct]);
    const ex=document.createElement("span"); ex.dir="auto"; ex.style.display="block"; ex.textContent=it.e;
    why.append(bb, ex);
    if(it.tr){ const tr=document.createElement("p"); tr.className="tr"; tr.textContent=it.tr; why.appendChild(tr); }
    if(!right) why.appendChild(topicButton(q));
  } else why.className="why hidden";
  renderStreak();
  justPicked=false;
  renderNav();
}

function renderNav(){
  const n=$("nav"); n.innerHTML=""; $("hint").textContent="";
  const last=idx===count-1;
  if(mode==="learn"){
    const b=document.createElement("button"); b.className="btn main";
    b.textContent= last?T().showRes:T().next; b.disabled=answers[idx]===null;
    b.onclick=()=> last?finish():(idx++,render()); n.appendChild(b);
    if(answers[idx]===null) $("hint").textContent=T().pickHint;
  } else {
    const p=document.createElement("button"); p.className="btn"; p.textContent=T().prev; p.disabled=idx===0;
    p.onclick=()=>{ idx--; render(); };
    const nx=document.createElement("button"); nx.className="btn main"; nx.textContent= last?T().end:T().nxt;
    nx.onclick=()=> last?confirmFinish():(idx++,render());
    n.append(p,nx);
    const left=answers.filter(x=>x===null).length;
    $("hint").textContent= left?T().left(left):T().allDone;
  }
}

function pick(i){
  if(finished) return;
  if(mode==="learn" && answers[idx]!==null) return;
  answers[idx]=i;
  if(mode==="learn"){
    streak = i===qs[idx].correct ? streak+1 : 0;
    bestStreak=Math.max(bestStreak,streak);
    justPicked=true;
  }
  render();
  const target = mode==="learn" ? document.querySelector("#nav .btn.main") : $("opts").children[i];
  if(target) target.focus();
}
function confirmFinish(){
  const left=answers.filter(x=>x===null).length;
  if(left && !confirm(T().confirm(left))) return;
  finish();
}
function finish(){
  if(finished) return;
  finished=true; clearInterval(tick);
  lastSecs=Math.round((Date.now()-startedAt)/1000);
  $("onlyWrong").setAttribute("aria-pressed","false");
  renderResult(); show("result");
  const correct=qs.filter((q,i)=>answers[i]===q.correct).length;
  countUp(correct);
  if(correct/count>=0.9) confetti();
}
function renderStreak(){
  const el=$("streak");
  if(mode!=="learn" || streak<2){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.textContent="🔥 "+streak;
  el.setAttribute("aria-label", T().streak(streak)); el.title=T().streak(streak);
  if(justPicked){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
const reduceMotion = ()=>window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(target){
  const span=$("bigScore").firstChild;
  if(reduceMotion() || target===0) return;
  const t0=performance.now(), dur=Math.min(1200, 300+target*40);
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    span.textContent=Math.round(target*e)+" ";
    if(k<1) requestAnimationFrame(step);
  };
  span.textContent="0 "; requestAnimationFrame(step);
}
function confetti(){
  if(reduceMotion()) return;
  const c=document.createElement("canvas"); c.className="confetti"; c.setAttribute("aria-hidden","true");
  document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  c.width=W*dpr; c.height=H*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=["--primary","--warn","--ok","--ink"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*11, vy:-Math.random()*12-4,
    w:6+Math.random()*6, h:4+Math.random()*4, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const frame=now=>{
    const t=now-t0; x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.globalAlpha=Math.max(0,1-t/2600); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if(t<2600) requestAnimationFrame(frame); else c.remove();
  };
  requestAnimationFrame(frame);
}
function renderResult(){
  const correct=qs.filter((q,i)=>answers[i]===q.correct).length;
  const pct=Math.round(correct/count*100);
  $("bigScore").innerHTML=correct+' <span>/ '+count+'</span>';
  $("pct").textContent=T().pct(pct,fmt(lastSecs))+(timedOut?T().timeout:"");
  $("verdict").textContent=T().v[pct>=90?0:pct>=75?1:pct>=60?2:3];
  const best=$("best");
  if(mode==="learn" && bestStreak>=2){ best.classList.remove("hidden"); best.textContent="🔥 "+T().best(bestStreak); }
  else best.classList.add("hidden");
  renderReview($("onlyWrong").getAttribute("aria-pressed")==="true");
}
function topicButton(q){
  const wrap=document.createElement("div");
  const b=document.createElement("button"); b.className="topicBtn"; b.type="button"; b.setAttribute("aria-expanded","false");
  b.textContent="📖 "+T().topicBtn;
  b.onclick=()=>{
    const open=b.getAttribute("aria-expanded")==="true";
    if(open){ wrap.querySelector(".topicPanel").remove(); b.setAttribute("aria-expanded","false"); b.textContent="📖 "+T().topicBtn; return; }
    const panel=topicPanel(q.lec,q.i); wrap.appendChild(panel);
    b.setAttribute("aria-expanded","true"); b.textContent="📖 "+T().topicHide;
    panel.scrollIntoView({behavior: reduceMotion()?"auto":"smooth", block:"nearest"});
  };
  wrap.appendChild(b); return wrap;
}
function topicPanel(lecId,i){
  const lec=LECTURES.find(l=>l.id===lecId), sec=lec.summary[lang][SEC_MAP[lecId][i]];
  const d=document.createElement("div"); d.className="topicPanel";
  const tag=document.createElement("span"); tag.className="lecTag"; tag.textContent=lec.title[lang];
  const h=document.createElement("h4"); h.textContent=sec.h;
  const list=document.createElement(sec.ordered?"ol":"ul");
  sec.items.forEach(t=>{ const li=document.createElement("li"); li.textContent=t; list.appendChild(li); });
  const sw=document.createElement("div"); sw.className="searchWrap";
  const sh=document.createElement("h5"); sh.textContent=T().searchH;
  const box=document.createElement("div"); box.className="search";
  const inp=document.createElement("input"); inp.type="search"; inp.autocomplete="off"; inp.enterKeyHint="search"; inp.placeholder=T().searchPh;
  inp.setAttribute("aria-label", T().searchH);
  const res=document.createElement("div");
  inp.addEventListener("input", ()=>renderSearch(res, inp.value));
  box.appendChild(inp); sw.append(sh, box, res);
  d.append(tag, h, list, sw);
  return d;
}
function renderReview(onlyWrong){
  const r=$("review"); r.innerHTML="";
  qs.forEach((q,i)=>{
    const a=answers[i], ok=a===q.correct; if(onlyWrong && ok) return;
    const it=item(q), d=document.createElement("div"); d.className="rev"+(ok?"":" bad");
    const t=(cls,txt)=>{ const e=document.createElement("p"); e.className=cls; e.textContent=txt; d.appendChild(e); };
    t("rq",(i+1)+". ["+it.lecName+"] "+it.q);
    if(a===null) t("ra wrong",T().none); else if(!ok) t("ra wrong",T().yours+it.opts[a]);
    t("ra right",T().correct+it.opts[q.correct]);
    t("re",it.e); d.lastChild.dir="auto";
    if(it.tr) t("re tr",it.tr);
    if(!ok) d.appendChild(topicButton(q));
    r.appendChild(d);
  });
  if(!r.children.length){ const p=document.createElement("p"); p.style.color="var(--muted)"; p.textContent=T().perfect; r.appendChild(p); }
}

$("onlyWrong").onclick=function(){ const on=this.getAttribute("aria-pressed")!=="true"; this.setAttribute("aria-pressed",on); renderReview(on); };
$("startBtn").onclick=()=> mode==="cards" ? startCards() : start();

/* ---- flashcards: front = question without options, back = correct answer + explanation ---- */
var MCQ_ONLY=/أي مما يلي|أي من التالي|أي مما سبق|أيّ مما يلي|which of the following|which one of the following/i;
let deck=[], fcKnown=0, fcTotal=0, fcRepeats=0;
function cardPool(){
  return buildPool().filter(p=>{
    const lec=LECTURES.find(l=>l.id===p.lec);
    return !MCQ_ONLY.test(lec.bank.ar[p.i][0]) && !MCQ_ONLY.test(lec.bank.en[p.i][0]);
  });
}
function startCards(){
  const pool=shuffle(cardPool());
  deck=pool.slice(0,planned()); fcTotal=deck.length; fcKnown=0; fcRepeats=0;
  $("fcStage").classList.remove("hidden"); $("fcDone").classList.add("hidden");
  show("cards"); renderCard();
}
function renderCard(){
  $("fcPos").innerHTML=T().fcPos(fcKnown,fcTotal);
  $("fcBar").style.width=(fcTotal? fcKnown/fcTotal*100 : 0)+"%";
  if(!deck.length){
    $("fcStage").classList.add("hidden"); $("fcDone").classList.remove("hidden");
    $("fcDoneP").textContent=T().fcDone(fcKnown,fcRepeats);
    if(fcTotal && !fcRepeats) confetti();
    return;
  }
  const c=deck[0], lec=LECTURES.find(l=>l.id===c.lec), b=lec.bank[lang][c.i];
  $("fcLec").textContent=lec.title[lang];
  $("fcQ").textContent=b[0]; $("fcA").textContent=b[1]; $("fcE").textContent=b[3];
  const tr=expAr(c.lec,c.i); $("fcT").textContent=tr||""; $("fcT").classList.toggle("hidden",!tr);
}
function flipCard(){ const f=$("flip"); f.classList.toggle("on"); $("fcBtns").classList.toggle("hidden", !f.classList.contains("on")); }
function nextCard(knew){
  const c=deck.shift();
  if(knew) fcKnown++; else { deck.push(c); fcRepeats++; }
  $("flip").classList.remove("on"); $("fcBtns").classList.add("hidden");
  setTimeout(renderCard, reduceMotion()?0:200);
  if(knew) $("fcPos").innerHTML=T().fcPos(fcKnown,fcTotal);
  $("fcBar").style.width=(fcKnown/fcTotal*100)+"%";
}
$("flip").onclick=flipCard;
$("fcYes").onclick=()=>nextCard(true);
$("fcNo").onclick=()=>nextCard(false);
$("fcQuit").onclick=()=>show("setup");
$("fcHome").onclick=()=>show("setup");
$("fcAgain").onclick=startCards;
$("langSwitch4").onclick=()=>setLang(lang==="ar"?"en":"ar");
document.addEventListener("keydown",e=>{
  if($("cards").classList.contains("hidden") || $("about").open || $("welcome").open || !deck.length) return;
  if(e.key===" " && document.activeElement!==$("flip")){ e.preventDefault(); flipCard(); }
  else if($("flip").classList.contains("on") && (e.key==="1"||e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key==="2")){
    nextCard(e.key==="2" || (lang==="ar" ? e.key==="ArrowLeft" : e.key==="ArrowRight"));
  }
});
window.addEventListener("beforeunload",e=>{
  if(mode==="exam" && !finished && !$("quiz").classList.contains("hidden")){ e.preventDefault(); e.returnValue=""; }
});
$("againBtn").onclick=()=>show("setup");
$("quitBtn").onclick=()=>{
  if(mode==="exam") return confirmFinish();
  const left=answers.filter(x=>x===null).length;
  if(left && !confirm(T().confirm(left))) return;
  if(answers.some(x=>x!==null)) finish();
  else { clearInterval(tick); show("setup"); }
};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden") || $("about").open || $("welcome").open || e.target.tagName==="INPUT") return;
  const k=e.key;
  if("1234".includes(k) && k.length===1) pick(+k-1);
  else if("١٢٣٤".includes(k) && k.length===1) pick("١٢٣٤".indexOf(k));
  else if(k==="Enter"){
    const m=document.querySelector("#nav .btn.main");
    if(m && !m.disabled && document.activeElement.tagName!=="BUTTON") m.click();
  }
});

/* ---- summary search: every word must appear in the topic title or one of its points (AR + EN text), results in lecture/section order ---- */
const norm=t=>t.toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
function searchSummaries(query){
  const words=norm(query).split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  const out=[];
  LECTURES.forEach(lec=>{
    lec.summary[lang].forEach((sec,k)=>{
      const other=lec.summary[lang==="ar"?"en":"ar"][k];
      const hay=norm([sec.h,...sec.items,other.h,...other.items].join(" \n "));
      if(!words.every(w=>hay.includes(w))) return;
      // AR and EN points are parallel by index, so a point matches if either language's version has the word
      const items=sec.items.filter((t,j)=>words.some(w=>norm(t+" "+(other.items[j]||"")).includes(w)));
      out.push({lec, sec, items: items.length ? items : sec.items});
    });
  });
  return {words, out};
}
function highlight(el, text, words){
  const n=norm(text); let i=0;
  const marks=[];
  words.forEach(w=>{ let k=n.indexOf(w); while(k>-1){ marks.push([k,k+w.length]); k=n.indexOf(w,k+w.length); } });
  marks.sort((a,b)=>a[0]-b[0]);
  // norm() keeps string length for Latin text; for Arabic it can drop diacritics, so fall back to plain text when lengths differ
  if(n.length!==text.length || !marks.length){ el.textContent=text; return; }
  marks.forEach(([a,b])=>{ if(a<i) return; el.append(text.slice(i,a)); const m=document.createElement("mark"); m.textContent=text.slice(a,b); el.append(m); i=b; });
  el.append(text.slice(i));
}
function renderSearch(box, query){
  box.replaceChildren();
  const r=searchSummaries(query);
  if(!r) return false;
  const c=document.createElement("p"); c.className="sCount"; c.textContent=T().sCount(r.out.length); box.append(c);
  r.out.forEach(({lec,sec,items})=>{
    const d=document.createElement("div"); d.className="sRes";
    const tag=document.createElement("span"); tag.className="lecTag"; tag.textContent=lec.title[lang];
    const h=document.createElement("h4"); highlight(h, sec.h, r.words);
    const ul=document.createElement("ul");
    items.forEach(t=>{ const li=document.createElement("li"); highlight(li, t, r.words); ul.append(li); });
    d.append(tag,h,ul); box.append(d);
  });
  return true;
}
function runSumSearch(){
  const on=renderSearch($("sumSearchRes"), $("sumSearch").value);
  $("sumSearchRes").classList.toggle("hidden", !on);
  $("sumBrowse").classList.toggle("hidden", on);
}
$("sumSearch").addEventListener("input", runSumSearch);

function renderSumTabs(){
  const c=$("sumTabs"); c.innerHTML="";
  c.classList.toggle("hidden", LECTURES.length===1);
  LECTURES.forEach(l=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent=l.title[lang];
    b.setAttribute("aria-pressed", activeSumLec===l.id);
    b.onclick=()=>{ activeSumLec=l.id; renderSumTabs(); renderSummary(); };
    c.appendChild(b);
  });
}
function renderSummary(){
  const lec = LECTURES.find(l=>l.id===activeSumLec);
  const data = lec.summary[lang];
  const c=$("summaryContent"); c.innerHTML="";
  data.forEach(sec=>{
    const d=document.createElement("div"); d.className="sec";
    const h=document.createElement("h3"); h.textContent=sec.h; d.appendChild(h);
    const list=document.createElement(sec.ordered?"ol":"ul");
    sec.items.forEach(t=>{ const li=document.createElement("li"); li.textContent=t; list.appendChild(li); });
    d.appendChild(list);
    c.appendChild(d);
  });
}

function isLight(){ return document.documentElement.dataset.theme==="light"; }
function updateThemeBtn(){ $("themeBtn").textContent = isLight() ? T().toDark : T().toLight; }
$("themeBtn").onclick=()=>{
  const light=!isLight();
  if(light) document.documentElement.dataset.theme="light"; else delete document.documentElement.dataset.theme;
  try{localStorage.setItem("me4441-theme", light?"light":"dark")}catch(e){}
  updateThemeBtn();
};
function closeWelcome(){ try{localStorage.setItem("me4441-welcomed","1")}catch(e){} }
$("welcomeGo").onclick=()=>$("welcome").close();
$("welcome").addEventListener("close", closeWelcome);
$("aboutBtn").onclick=()=>$("about").showModal();
$("brandBtn").onclick=()=>$("about").showModal();
(function(){
  const card=document.querySelector("#quiz .card");
  if(!window.matchMedia || !matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  card.addEventListener("pointermove",e=>{
    if(reduceMotion()) return;
    const r=card.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    card.style.transform="perspective(1000px) rotateX("+(-py*3).toFixed(2)+"deg) rotateY("+(px*3).toFixed(2)+"deg)";
  });
  card.addEventListener("pointerleave",()=>{ card.style.transform=""; });
})();
$("aboutClose").onclick=()=>$("about").close();
$("about").addEventListener("click",e=>{ if(e.target===$("about")) $("about").close(); });

try{ const s=localStorage.getItem("me4441-lang"); if(s==="en"||s==="ar") lang=s; }catch(e){}
if(LECTURES.length===1) $("lectures").closest(".group").classList.add("hidden");
applyLang();
let welcomed=false; try{ welcomed=localStorage.getItem("me4441-welcomed")==="1"; }catch(e){}
if(!welcomed) $("welcome").showModal();
</script>
