<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Translation Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF0; --surface:#F7F9FA; --ink:#1D2A31; --muted:#5E6E76; --line:#CFD8DC;
  --primary:#2F6F6A; --primary-soft:#D6E7E4; --ok:#2E8657; --ok-soft:#DCEFE3; --bad:#B6483F; --bad-soft:#F5DEDB;
  --idle:#C3CDD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A1E; --surface:#1B242A; --ink:#E3EAEC; --muted:#93A3AA; --line:#2E3A41;
    --primary:#6FB5AC; --primary-soft:#1F3634; --ok:#5DBB86; --ok-soft:#1C3527; --bad:#E07C73; --bad-soft:#3A2220;
    --idle:#34424A;
  }
}
:root[data-theme="dark"]{
  --bg:#131A1E; --surface:#1B242A; --ink:#E3EAEC; --muted:#93A3AA; --line:#2E3A41;
  --primary:#6FB5AC; --primary-soft:#1F3634; --ok:#5DBB86; --ok-soft:#1C3527; --bad:#E07C73; --bad-soft:#3A2220;
  --idle:#34424A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  font-size:clamp(16px, 0.45vw + 14.5px, 19px); line-height:1.7;
}
.wrap{width:100%; max-width:760px; margin:0 auto; padding:clamp(20px,4vw,48px) clamp(14px,4vw,32px) 64px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--primary); outline-offset:2px}
.hidden{display:none !important}

/* setup */
.intro h1{font-size:clamp(1.7rem, 3vw + 1rem, 2.5rem); line-height:1.25; margin:10px 0 6px; font-weight:700; letter-spacing:-.3px}
.intro p{margin:0; color:var(--muted); max-width:60ch}
.group{margin-top:30px}
.group h2{font-size:1rem; font-weight:600; margin:0 0 12px}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mode{
  text-align:start; background:var(--surface); border:2px solid var(--line); border-radius:14px;
  padding:16px 16px 14px; transition:border-color .15s, background .15s;
}
.mode{display:flex; flex-direction:column; justify-content:flex-start}
.mode strong{display:block; font-size:1.02rem; margin-bottom:4px}
.mode span{color:var(--muted); font-size:.9rem; line-height:1.55; display:block}
.mode[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft)}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  min-width:64px; min-height:46px; padding:8px 16px; border-radius:999px; border:2px solid var(--line);
  background:var(--surface); font-weight:600; font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{border-color:var(--primary); background:var(--primary); color:var(--surface)}
.chip.en{font-family:'Segoe UI', system-ui, sans-serif}
.note{color:var(--muted); font-size:.88rem; margin-top:10px}
.start{
  margin-top:34px; width:100%; min-height:54px; padding:14px; border:none; border-radius:14px;
  background:var(--primary); color:var(--surface); font-weight:700; font-size:1.08rem;
}
@media (hover:hover){ .start:hover{filter:brightness(1.07)} }
.start:disabled{opacity:.45; cursor:default}
.start.secondary{background:var(--surface); color:var(--ink); border:2px solid var(--line); margin-top:12px}

/* quiz */
.bar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.pos{font-weight:600; font-variant-numeric:tabular-nums}
.pos small{color:var(--muted); font-weight:400}
.barside{display:flex; align-items:center; gap:8px}
.timer{font-variant-numeric:tabular-nums; font-weight:700; padding:4px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); direction:ltr}
.timer.low{color:var(--bad); border-color:var(--bad)}
.mini{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:.85rem; min-height:34px}
.quit{background:none; border:none; color:var(--muted); font-size:.9rem; text-decoration:underline; padding:6px}
.rail{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.dot{width:14px; height:14px; border-radius:50%; background:var(--idle); border:none; padding:0; transition:transform .15s, background .2s}
.dot.cur{outline:2px solid var(--ink); outline-offset:2px}
.dot.ans{background:var(--primary)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
@media (hover:hover){ .rail.jump .dot:hover{transform:scale(1.25)} }
@media (pointer:coarse){ .rail.jump .dot{width:18px; height:18px} }
.card{background:var(--surface); border-radius:18px; padding:clamp(18px,3vw,32px) clamp(15px,3vw,30px); border:1px solid var(--line)}
.lecTag{display:inline-block; background:var(--primary-soft); color:var(--primary); font-size:.78rem; font-weight:600; padding:3px 12px; border-radius:999px; margin-bottom:12px}
.qtext{font-size:1.18rem; font-weight:600; line-height:1.65; margin:0 0 18px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{
  display:flex; align-items:flex-start; gap:12px; text-align:start; width:100%; min-height:52px;
  background:var(--bg); border:2px solid transparent; border-radius:12px; padding:12px 14px;
  transition:border-color .12s, background .12s;
}
@media (hover:hover){ .opt:hover:not(:disabled){border-color:var(--line)} }
.opt .l{
  flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface); border:1.5px solid var(--line); font-weight:700; font-size:.9rem; margin-top:1px;
}
.opt .t{flex:1; min-width:0; overflow-wrap:anywhere}
.opt.sel{border-color:var(--primary); background:var(--primary-soft)}
.opt.sel .l{background:var(--primary); color:var(--surface); border-color:var(--primary)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.ok .l{background:var(--ok); color:var(--surface); border-color:var(--ok)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.bad .l{background:var(--bad); color:var(--surface); border-color:var(--bad)}
.opt:disabled{cursor:default; color:inherit}
.why{margin-top:16px; padding:14px 16px; border-radius:12px; border-inline-start:4px solid var(--ok); background:var(--ok-soft); font-size:.97rem}
.why.bad{border-inline-start-color:var(--bad); background:var(--bad-soft)}
.why b{display:block; margin-bottom:2px}
.nav{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; min-height:52px; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:600}
.btn.main{background:var(--primary); border-color:var(--primary); color:var(--surface)}
.btn:disabled{opacity:.45; cursor:default}
.hint{color:var(--muted); font-size:.85rem; margin-top:10px; text-align:center}

/* result */
.score{text-align:center; padding:26px 0 10px}
.score .big{font-size:clamp(3.4rem, 6vw + 1.5rem, 5rem); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; direction:ltr}
.score .big span{font-size:.42em; color:var(--muted); font-weight:500}
.score p{margin:10px 0 0; color:var(--muted)}
.verdict{font-size:1.15rem; font-weight:600; color:var(--ink) !important; margin-top:14px !important}
.tools{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px; gap:10px; flex-wrap:wrap}
.tools h2{margin:0; font-size:1.1rem}
.toggle{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.9rem; min-height:38px}
.toggle[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.review{display:grid; grid-template-columns:1fr; gap:10px}
.rev{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; border-inline-start:5px solid var(--ok)}
.rev.bad{border-inline-start-color:var(--bad)}
.rev .rq{font-weight:600; margin:0 0 8px}
.rev .ra{font-size:.93rem; margin:2px 0}
.rev .ra.wrong{color:var(--bad)}
.rev .ra.right{color:var(--ok)}
.rev .re{font-size:.9rem; color:var(--muted); margin-top:8px}
.again{margin-top:22px}

/* summary */
.sec{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px}
.sec h3{margin:0 0 10px; font-size:1.05rem; color:var(--primary)}
.sec ul, .sec ol{margin:0; padding-inline-start:22px; display:flex; flex-direction:column; gap:6px; font-size:.97rem; line-height:1.6}

/* phones */
@media (max-width:560px){
  .modes{grid-template-columns:1fr}
  .qtext{font-size:1.08rem}
  .chip{flex:1 1 0; min-width:0; padding:8px 0}
}
/* tablets landscape & laptops */
@media (min-width:1024px){
  .wrap{max-width:880px}
  .setup-grid{display:grid; grid-template-columns:1fr 1.15fr; gap:48px; align-items:start; min-height:70vh; align-content:center}
  .setup-grid .intro{position:sticky; top:48px}
  .setup-grid .group:first-child{margin-top:0}
  .review{grid-template-columns:1fr 1fr; align-items:start}
}
@media (min-width:1024px) and (min-height:700px){
  #quiz .card{min-height:420px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <section id="setup">
    <div class="setup-grid">
      <div class="intro">
        <h1 data-i="title"></h1>
        <p data-i="sub"></p>
      </div>
      <div>
        <div class="group">
          <h2 data-i="langH"></h2>
          <div class="chips" id="langs">
            <button class="chip" data-lang="ar" aria-pressed="true">العربية</button>
            <button class="chip en" data-lang="en" aria-pressed="false">English</button>
          </div>
        </div>
        <div class="group">
          <h2 data-i="lecH"></h2>
          <div class="chips" id="lectures"></div>
          <p class="note" id="availNote"></p>
        </div>
        <div class="group">
          <h2 data-i="modeH"></h2>
          <div class="modes">
            <button class="mode" data-mode="learn" aria-pressed="true"><strong data-i="m1"></strong><span data-i="m1d"></span></button>
            <button class="mode" data-mode="exam" aria-pressed="false"><strong data-i="m2"></strong><span data-i="m2d"></span></button>
          </div>
        </div>
        <div class="group">
          <h2 data-i="countH"></h2>
          <div class="chips" id="counts">
            <button class="chip" data-n="10" aria-pressed="false">10</button>
            <button class="chip" data-n="20" aria-pressed="true">20</button>
            <button class="chip" data-n="30" aria-pressed="false">30</button>
            <button class="chip" data-n="40" aria-pressed="false">40</button>
            <button class="chip" data-n="50" aria-pressed="false">50</button>
          </div>
          <p class="note" id="timeNote"></p>
        </div>
        <button class="start" id="startBtn" data-i="start"></button>
        <button class="start secondary" id="summaryBtn" data-i="summaryBtn"></button>
      </div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="bar">
      <div class="pos" id="pos"></div>
      <div class="barside">
        <div class="timer hidden" id="timer"></div>
        <button class="mini" id="langSwitch"></button>
        <button class="quit" id="quitBtn" data-i="quit"></button>
      </div>
    </div>
    <div class="rail" id="rail"></div>
    <div class="card">
      <span class="lecTag" id="lecTag"></span>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="why hidden" id="why"></div>
    </div>
    <div class="nav" id="nav"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section id="result" class="hidden">
    <div class="score">
      <div class="big" id="bigScore"></div>
      <p id="pct"></p>
      <p class="verdict" id="verdict"></p>
    </div>
    <div class="tools">
      <h2 data-i="review"></h2>
      <div class="barside">
        <button class="mini" id="langSwitch2"></button>
        <button class="toggle" id="onlyWrong" aria-pressed="false" data-i="onlyWrong"></button>
      </div>
    </div>
    <div class="review" id="review"></div>
    <button class="start again" id="againBtn" data-i="again"></button>
  </section>

  <section id="summary" class="hidden">
    <div class="bar">
      <div class="pos" data-i="summaryTitle"></div>
      <div class="barside">
        <button class="mini" id="langSwitch3"></button>
        <button class="quit" id="summaryBackBtn" data-i="back"></button>
      </div>
    </div>
    <div class="chips" id="sumTabs" style="margin-bottom:18px"></div>
    <div id="summaryContent"></div>
  </section>

</div>

<script>
/* ============ Lecture 1: Introduction to Media Translation ============ */
const BANK_L1_AR = [
["كلمة Media (جمع Medium) تشير إلى:","أي صيغة (format) تُستخدم لنقل المعلومات",["فقط الأجهزة الإلكترونية","فقط الصحف الورقية","مرادف حصري لكلمة الإنترنت"],"التعريف في المحاضرة: Media refers to any kind of format used to convey information."],
["تعريف «وسائل الإعلام الجماهيري» (Mass media) يركز على:","الوصول إلى عدد كبير من الناس عبر وسيلة تواصل عام",["التواصل الفردي الخاص فقط","الاستخدام الحكومي فقط","الأدوات المكتبية"],"Mass media = a means of public communication reaching a large audience."],
["أي مما يلي مذكور صراحة كنوع من أنواع الوسائط في المحاضرة؟","التصوير الفوتوغرافي (Photography)",["المكالمات الهاتفية الخاصة","الاجتماعات الرسمية وجهًا لوجه","المذكرات الداخلية للشركات"],"أنواع الوسائط المذكورة: تلفاز، راديو، أفلام وفيديو، إعلام مطبوع، تصوير، إعلام إلكتروني/رقمي."],
["الإعلام الإلكتروني (Electronic Media) يشمل:","أي جهاز يُستخدم في عملية التواصل الإلكتروني (تلفاز، راديو، هاتف، حاسوب، جهاز ألعاب، جهاز محمول)",["الأجهزة الميكانيكية غير الكهربائية فقط","الكتب المطبوعة فقط","وسائل النقل العام"],"التعريف: أي equipment يُستخدم في electronic communication process يُعتبر إعلامًا إلكترونيًا."],
["الإعلام الرقمي (Digital Media) يُعرَّف بأنه:","معلومات مُرقمنة تُبَث لنا عبر شاشة و/أو مكبر صوت (مثل يوتيوب)",["أي طباعة ورقية حديثة","البريد التقليدي","المكالمات التناظرية القديمة فقط"],"Digital media refers to mediums of digitized information broadcast through a screen and/or a speaker."],
["حسب المحاضرة، الفرق بين Digital وMedia هو:","Digital = بيانات ممثلة بسلسلة أرقام، وMedia = طرق بث/نقل هذه المعلومات",["هما مرادفان تمامًا","Digital يخص الصوت فقط وMedia يخص الصورة فقط","لا علاقة بينهما إطلاقًا"],"Digital = data as digits، media = methods of broadcasting or communicating that data."],
["الإعلام المعلوماتي (Informative media) مثاله:","نشرات الأخبار والصحف والمواقع المعلوماتية",["الروايات والأفلام","الإعلانات التجارية","الكتب المدرسية فقط"],"Informative media: news shows, newspapers, informative websites."],
["الإعلام التعليمي (Educational media) يشمل:","الكتب والفيديوهات التعليمية وبرامج البرمجيات التعليمية",["نشرات الأخبار العاجلة","الإعلانات التجارية","المجلات الترفيهية"],"Educational media: books, educational video, or educational software programs."],
["الإعلام الإقناعي (Persuasive media) مثاله:","جميع أنواع الإعلانات والبرامج الدعائية ومقالات الرأي الصحفية",["الروايات الأدبية","الكتب العلمية","الأفلام الوثائقية المحايدة"],"Persuasive media: advertising, TV infomercials, newspaper editorials, or persuasive websites."],
["الإعلام الترفيهي (Entertainment media) يشمل:","المجلات الترفيهية والأفلام والروايات والمواقع الترفيهية",["التقارير الإخبارية الرسمية","الأدلة التقنية","الوثائق الحكومية"],"Entertainment media: entertainment magazines, movies, novels, entertainment-related websites."],
["العنوان الصحفي (Headline) هو:","الملخص القصير الذي يقدّم الخبر في بداية نشرة تلفزيونية/إذاعية أو أعلى مقال في صحيفة أو موقع",["الفقرة الختامية للمقال","اسم الكاتب فقط","تاريخ النشر فقط"],"Headline = the short summary which introduces the story at the beginning of a broadcast or above an article."],
["لماذا تُعتبر العناوين الصحفية الإنجليزية صعبة الفهم أحيانًا؟","لأن أسلوبها الخاص «Headlinese» يختلف كثيرًا عن الإنجليزية العادية",["لأنها مكتوبة بلغة أجنبية غير الإنجليزية","لأنها تحتوي أخطاء إملائية دائمًا","لأنها أطول من المقال نفسه"],"الأسلوب الخاص للعناوين يجعلها significantly different from ordinary English."],
["ما أهمية معرفة السمات النحوية والمعجمية لعناوين الأخبار للمترجم؟","تسهّل ترجمة هذه العناوين بدقة بين لغتين مختلفتين كالعربية والإنجليزية",["لا علاقة لها بجودة الترجمة","تخص فقط تصميم الصحيفة","تُستخدم فقط في الامتحانات الأكاديمية"],"الإلمام بهذه السمات يسهّل translation of such headlines between two distinct languages."],
["العناوين الصحفية غالبًا:","ليست جملًا كاملة بل ملخصات قصيرة لجذب الانتباه",["دائمًا جمل تامة الأركان","تحتوي دائمًا فعلًا وفاعلًا ومفعولًا كاملين","أطول من نص الخبر نفسه"],"Headlines are not full sentences but short summaries designed to attract attention."],
["قاعدة استخدام الأزمنة في العناوين للأحداث الماضية/الحالية:","تُستخدم صيغة المضارع البسيط حتى للأحداث التي وقعت بالفعل",["يُستخدم الماضي التام دائمًا","يُستخدم المستقبل التام","لا تُستخدم أفعال إطلاقًا"],"مثال: Parliament confirms new policy — present simple لحدث وقع بالفعل."],
["قاعدة استخدام الأزمنة في العناوين للأحداث المستقبلية:","يُستخدم المصدر مع to، مثل: President to visit France",["يُستخدم Present Continuous","يُستخدم Past Perfect","تُستخدم Would"],"Use infinitives for future events، e.g. President to visit France for further talks."],
["أي من التالي صحيح بخصوص أفعال الكينونة (to be) في العناوين؟","غالبًا ما تُحذف (is, are, was, were) لتوفير المساحة",["تُكتب دائمًا كاملة","تُستبدل بعلامات ترقيم فقط","تُترجم حرفيًا دائمًا للعربية"],"To be verbs، such as is, are, was and were should be omitted."],

"Assessing quality in audiovisual translation is complex because it involves multiple semiotic modes (spoken, written, visual, acoustic) that interact in time and space.",
"A high-quality translation must be linguistically correct and synchronize with sound, image, and editing rhythm."
]},
{h:"02 — Defining Quality in AVT: Functional Adequacy", items:[
"Quality goes beyond linguistic accuracy to include timing, readability, visual clarity, and synchronization with audio.",
"A linguistically correct subtitle that is shown too briefly or blocks the actor's face is perceived as low-quality by viewers.",
"In dubbing, the text must match lip movements, tone, and performance style to be accepted as \"natural\".",
"Professionals often define quality through functional adequacy — how well the translation serves the viewing experience — rather than strict linguistic equivalence."
]},
{h:"03 — TQA in Academic Translation Studies", items:[
"Skopos theory and Descriptive Translation Studies have been adapted for AVT, where translation is guided by purpose (inform, entertain, localize) and constraints (time, space, synchronization).",
"The quality of subtitled dialogue is judged by the translator's ability to condense dialogue while preserving narrative coherence and humor.",
"Díaz Cintas and Remael (2021) found that good subtitles balance fidelity with readability.",
"Traditional academic TQA models must evolve to include multimodal fidelity and user-centered readability."
]},
{h:"04 — TQA in the Industry: TAUS DQF and MQM", items:[
"TAUS: a global industry organization founded in 2004 to promote innovation and standardization in translation technologies.",
"DQF: a set of tools, metrics, and best practices for measuring and managing translation quality, customizable by purpose.",
"MQM: developed under the EU-funded QTLaunchPad and QT21 projects (2012–2018); a hierarchical error taxonomy covering accuracy, fluency, terminology, style, locale convention, and verity (truthfulness).",
"Platforms like Netflix have internal guidelines such as Timed Text Style Guides specifying subtitle length, reading speed, punctuation, and tone."
]},
{h:"05 — Automatic Quality Assurance Tools", items:[
"Tools like Xbench and OOONA QA detect technical errors (timing, overlaps, missing subtitles).",
"Despite their effectiveness, they still rely on human reviewers for stylistic and cultural appropriateness, reflecting a hybrid human-machine workflow."
]},
{h:"06 — Human Evaluation Methods", items:[
"Human evaluation combines linguistic, technical, and perceptual criteria: accuracy, fluency, and synchronization for subtitling; lip-sync, voice acting, and cultural adaptation for dubbing.",
"Spirited Away (2001): its English dubbing was praised for preserving emotional tone while adapting cultural references.",
"Squid Game (2021): faced criticism over mistranslated subtitles that sparked controversy on social media, showing that quality perception is mediated by audiences and platforms."
]},
{h:"07 — Evaluators and Audience Feedback", items:[
"Evaluators include professional translators, reviewers, and even end-users, with increasing reliance on crowdsourced evaluation and viewer feedback.",
"Fan communities (YouTube, Viki) correct and annotate subtitles — a form of \"grassroots TQA\".",
"Professional evaluators use structured checklists such as Netflix's Hermes test to measure accuracy and timing.",
"User-centered approaches argue that true quality lies in the viewer's comprehension and enjoyment, not only linguistic precision."
]},
{h:"08 — Automated Evaluation and Machine Translation", items:[
"Metrics like BLEU and TER are limited in AVT because they cannot account for timing, multimodality, or performative elements.",
"AI subtitling tools (e.g., BBC, YouTube) use automatic speech recognition (ASR) combined with neural machine translation (NMT), then are post-edited by humans for timing and readability.",
"These tools increase speed and accessibility (especially for live captioning), but their evaluation still requires human oversight since metrics cannot measure humor timing, emotion, or visual fit."
]},
{h:"09 — Integrated Human–Machine Workflows", items:[
"Post-editing: a human translator refines machine-generated subtitles or dubbing scripts.",
"Example: a literal machine translation of a Spanish Netflix series that ignores cultural nuance is adjusted by a post-editor to match the show's tone and character voice.",
"Post-editing effort is measured in time, keystrokes, and cognitive load (via eye-tracking), using tools like PET and CASMACAT."
]},
{h:"10 — Ethical Challenges and Conclusions", items:[
"Challenges: should AI-generated subtitles be labeled as such, and how can fair pay be ensured for human post-editors?",
"Training translators and evaluators must include technological literacy (post-editing, QA automation tools) and cultural sensitivity (humor, dialects, gestures).",
"The future of TQA in this field lies in hybrid evaluation methods combining automatic metrics with human-centered feedback, usability testing, and multimodal analysis."
]}
];

const LECTURES = [
  { id:"l1", title:{ar:"مقدمة الإعلام", en:"Media Intro"}, bank:{ar:BANK_L1_AR, en:BANK_L1_EN}, summary:{ar:SUM_L1_AR, en:SUM_L1_EN} },
  { id:"l2", title:{ar:"ترجمة العناوين", en:"Headline Translation"}, bank:{ar:BANK_L2_AR, en:BANK_L2_EN}, summary:{ar:SUM_L2_AR, en:SUM_L2_EN} },
  { id:"l3", title:{ar:"تقييم الجودة (TQA)", en:"Quality Assessment (TQA)"}, bank:{ar:BANK_L3_AR, en:BANK_L3_EN}, summary:{ar:SUM_L3_AR, en:SUM_L3_EN} }
];

const UI = {
  ar:{
    title:"كويز مقرر ترجمة الإعلام",
    sub:"اختر محاضرة واحدة أو أكثر من محاضرات المقرر، وابدأ اختبارك. تنسحب الأسئلة عشوائيًا من المحاضرات المختارة، وترتيب الخيارات يتغير كل مرة.",
    langH:"لغة الأسئلة", lecH:"اختر المحاضرات", modeH:"النمط", countH:"عدد الأسئلة",
    selAll:"تحديد الكل", avail:n=>"عدد الأسئلة المتاحة حسب اختيارك: "+n, needLec:"اختر محاضرة واحدة على الأقل لتبدأ.",

  },

const SEC_PER_Q = 60;
const $ = id => document.getElementById(id);

let lang="ar", mode="learn", count=20;
let selectedLectures = new Set(LECTURES.map(l=>l.id));
let activeSumLec = "l1";
let qs=[], answers=[], idx=0, timeLeft=0, tick=null, startedAt=0, finished=false, lastSecs=0, timedOut=false;
const T = () => UI[lang];

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function show(id){ ["setup","quiz","result","summary"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }
function item(q){
  const lec = LECTURES.find(l=>l.id===q.lec);
  const bank = lec.bank[lang];
  const b = bank[q.i];
  const base=[b[1],...b[2]];
  return {q:b[0], opts:q.perm.map(k=>base[k]), e:b[3], lecName:lec.title[lang]};
}

function renderLecChips(){
  const c=$("lectures"); c.innerHTML="";
  const allBtn=document.createElement("button"); allBtn.className="chip";
  allBtn.textContent=T().selAll;
  allBtn.setAttribute("aria-pressed", selectedLectures.size===LECTURES.length);
  allBtn.onclick=()=>{ LECTURES.forEach(l=>selectedLectures.add(l.id)); renderLecChips(); updateAvail(); };
  c.appendChild(allBtn);
  LECTURES.forEach(l=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent=l.title[lang];
    b.setAttribute("aria-pressed", selectedLectures.has(l.id));
    b.onclick=()=>{
      if(selectedLectures.has(l.id)) selectedLectures.delete(l.id); else selectedLectures.add(l.id);
      renderLecChips(); updateAvail();
    };
    c.appendChild(b);
  });
}
function updateAvail(){
  const n = selectedLectures.size;
  if(n===0){ $("availNote").textContent = T().needLec; }
  else {
    const total = LECTURES.filter(l=>selectedLectures.has(l.id)).reduce((s,l)=>s+l.bank.ar.length,0);
    $("availNote").textContent = T().avail(total);
  }
  $("startBtn").disabled = n===0;
}

function applyLang(){
  const html=document.documentElement;
  html.lang=lang; html.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = T().title;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent=T()[el.dataset.i]; });
  $("langSwitch").textContent=T().switchTo; $("langSwitch2").textContent=T().switchTo; $("langSwitch3").textContent=T().switchTo;
  document.querySelectorAll("#langs .chip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.lang===lang));
  renderLecChips(); updateAvail();
  updateNote();
  if(!$("quiz").classList.contains("hidden")) render();
  if(!$("result").classList.contains("hidden")) renderResult();
  if(!$("summary").classList.contains("hidden")){ renderSumTabs(); renderSummary(); }
}
function updateNote(){ $("timeNote").textContent = mode==="exam" ? T().noteExam(count*SEC_PER_Q/60) : T().noteLearn; }
function setLang(l){ lang=l; try{localStorage.setItem("mtq-lang",l)}catch(e){} applyLang(); }

document.querySelectorAll("#langs .chip").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; document.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed", x===b)); updateNote();
});
document.querySelectorAll("#counts .chip").forEach(b=>b.onclick=()=>{
  count=+b.dataset.n; document.querySelectorAll("#counts .chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); updateNote();
});
$("langSwitch").onclick=$("langSwitch2").onclick=$("langSwitch3").onclick=()=>setLang(lang==="ar"?"en":"ar");
$("summaryBtn").onclick=()=>{ renderSumTabs(); renderSummary(); show("summary"); };
$("summaryBackBtn").onclick=()=>show("setup");

function buildPool(){
  let pool=[];
  LECTURES.forEach(l=>{ if(selectedLectures.has(l.id)){ for(let i=0;i<l.bank.ar.length;i++) pool.push({lec:l.id, i}); } });
  return pool;
}

function start(){
  const pool = shuffle(buildPool());
  const n = Math.min(count, pool.length);
  qs = pool.slice(0,n).map(p=>{
    const perm=shuffle([0,1,2,3]);
    return {lec:p.lec, i:p.i, perm, correct:perm.indexOf(0)};
  });
  count = n;
  answers=new Array(count).fill(null); idx=0; finished=false; timedOut=false; startedAt=Date.now();
  clearInterval(tick);
  const t=$("timer");
  if(mode==="exam"){
    timeLeft=count*SEC_PER_Q; t.classList.remove("hidden","low"); t.textContent=fmt(timeLeft);
    tick=setInterval(()=>{
      timeLeft--; t.textContent=fmt(Math.max(timeLeft,0)); t.classList.toggle("low", timeLeft<=60);
      if(timeLeft<=0){ timedOut=true; finish(); }
    },1000);
  } else t.classList.add("hidden");
  $("rail").classList.toggle("jump", mode==="exam");
  show("quiz"); render();
}

function renderRail(){
  const r=$("rail"); r.innerHTML="";
  qs.forEach((q,i)=>{
    const d=document.createElement("button"); d.className="dot"; d.setAttribute("aria-label",T().qn+(i+1));
    if(answers[i]!==null) d.classList.add(mode==="learn" ? (answers[i]===q.correct?"ok":"bad") : "ans");
    if(i===idx) d.classList.add("cur");
    if(mode==="exam") d.onclick=()=>{ idx=i; render(); }; else d.tabIndex=-1;
    r.appendChild(d);
  });
}

function render(){
  const q=qs[idx], it=item(q), a=answers[idx], L=T().letters;
  $("pos").innerHTML=T().pos(idx+1,count);
  $("lecTag").textContent=it.lecName;
  $("qtext").textContent=it.q;
  renderRail();
  const box=$("opts"); box.innerHTML="";
  const locked = mode==="learn" && a!==null;
  it.opts.forEach((o,i)=>{
    const b=document.createElement("button"); b.className="opt";
    const l=document.createElement("span"); l.className="l"; l.textContent=L[i];
    const t=document.createElement("span"); t.className="t"; t.textContent=o;
    b.append(l,t);
    if(locked){ b.disabled=true; if(i===q.correct) b.classList.add("ok"); else if(i===a) b.classList.add("bad"); }
    else if(a===i) b.classList.add("sel");
    b.onclick=()=>pick(i); box.appendChild(b);
  });
  const why=$("why");
  if(locked){
    const right=a===q.correct;
    why.className="why"+(right?"":" bad");
    why.innerHTML=""; const bb=document.createElement("b"); bb.textContent= right?T().right:T().wrong(L[q.correct]);
    why.append(bb, document.createTextNode(it.e));
  } else why.className="why hidden";
  renderNav();
}

function renderNav(){
  const n=$("nav"); n.innerHTML=""; $("hint").textContent="";
  const last=idx===count-1;
  if(mode==="learn"){
    const b=document.createElement("button"); b.className="btn main";
    b.textContent= last?T().showRes:T().next; b.disabled=answers[idx]===null;
    b.onclick=()=> last?finish():(idx++,render()); n.appendChild(b);
    if(answers[idx]===null) $("hint").textContent=T().pickHint;
  } else {
    const p=document.createElement("button"); p.className="btn"; p.textContent=T().prev; p.disabled=idx===0;
    p.onclick=()=>{ idx--; render(); };
    const nx=document.createElement("button"); nx.className="btn main"; nx.textContent= last?T().end:T().nxt;
    nx.onclick=()=> last?confirmFinish():(idx++,render());
    n.append(p,nx);
    const left=answers.filter(x=>x===null).length;
    $("hint").textContent= left?T().left(left):T().allDone;
  }
}

function pick(i){
  if(finished) return;
  if(mode==="learn" && answers[idx]!==null) return;
  answers[idx]=i; render();
}
function confirmFinish(){
  const left=answers.filter(x=>x===null).length;
  if(left && !confirm(T().confirm(left))) return;
  finish();
}
function finish(){
  if(finished) return;
  finished=true; clearInterval(tick);
  lastSecs=Math.round((Date.now()-startedAt)/1000);
  $("onlyWrong").setAttribute("aria-pressed","false");
  renderResult(); show("result");
}
function renderResult(){
  const correct=qs.filter((q,i)=>answers[i]===q.correct).length;
  const pct=Math.round(correct/count*100);
  $("bigScore").innerHTML=correct+' <span>/ '+count+'</span>';
  $("pct").textContent=T().pct(pct,fmt(lastSecs))+(timedOut?T().timeout:"");
  $("verdict").textContent=T().v[pct>=90?0:pct>=75?1:pct>=60?2:3];
  renderReview($("onlyWrong").getAttribute("aria-pressed")==="true");
}
function renderReview(onlyWrong){
  const r=$("review"); r.innerHTML="";
  qs.forEach((q,i)=>{
    const a=answers[i], ok=a===q.correct; if(onlyWrong && ok) return;
    const it=item(q), d=document.createElement("div"); d.className="rev"+(ok?"":" bad");
    const t=(cls,txt)=>{ const e=document.createElement("p"); e.className=cls; e.textContent=txt; d.appendChild(e); };
    t("rq",(i+1)+". ["+it.lecName+"] "+it.q);
    if(a===null) t("ra wrong",T().none); else if(!ok) t("ra wrong",T().yours+it.opts[a]);
    t("ra right",T().correct+it.opts[q.correct]);
    t("re",it.e);
    r.appendChild(d);
  });
  if(!r.children.length){ const p=document.createElement("p"); p.style.color="var(--muted)"; p.textContent=T().perfect; r.appendChild(p); }
}

$("onlyWrong").onclick=function(){ const on=this.getAttribute("aria-pressed")!=="true"; this.setAttribute("aria-pressed",on); renderReview(on); };
$("startBtn").onclick=start;
$("againBtn").onclick=()=>show("setup");
$("quitBtn").onclick=()=>{
  if(mode==="exam") confirmFinish();
  else if(answers.some(x=>x!==null)) finish();
  else { clearInterval(tick); show("setup"); }
};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden")) return;
  const k=e.key;
  if("1234".includes(k) && k.length===1) pick(+k-1);
  else if("١٢٣٤".includes(k) && k.length===1) pick("١٢٣٤".indexOf(k));
  else if(k==="Enter"){
    const m=document.querySelector("#nav .btn.main");
    if(m && !m.disabled && document.activeElement.tagName!=="BUTTON") m.click();
  }
});

function renderSumTabs(){
  const c=$("sumTabs"); c.innerHTML="";
  LECTURES.forEach(l=>{
    const b=document.createElement("button"); b.className="chip";
    b.textContent=l.title[lang];
    b.setAttribute("aria-pressed", activeSumLec===l.id);
    b.onclick=()=>{ activeSumLec=l.id; renderSumTabs(); renderSummary(); };
    c.appendChild(b);
  });
}
function renderSummary(){
  const lec = LECTURES.find(l=>l.id===activeSumLec);
  const data = lec.summary[lang];
  const c=$("summaryContent"); c.innerHTML="";
  data.forEach(sec=>{
    const d=document.createElement("div"); d.className="sec";
    const h=document.createElement("h3"); h.textContent=sec.h; d.appendChild(h);
    const list=document.createElement(sec.ordered?"ol":"ul");
    sec.items.forEach(t=>{ const li=document.createElement("li"); li.textContent=t; list.appendChild(li); });
    d.appendChild(list);
    c.appendChild(d);
  });
}

try{ const s=localStorage.getItem("mtq-lang"); if(s==="en"||s==="ar") lang=s; }catch(e){}
applyLang();
</script>
